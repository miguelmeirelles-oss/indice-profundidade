<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progressão docente — Aula por IA</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root{--menu:#17389C;--azul:#2E62C6;--navy:#0E2A5C;--bloco:#EFF1F5;--cinza:#5b6b86;--verde:#1a7a3c;--vermelho:#8a1c1c;--ocre:#8a6100;--linha:#d7deea}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:Arial,Helvetica,sans-serif;color:var(--navy);background:#fff;font-size:15px;line-height:1.45}
  .wrap{max-width:980px;margin:0 auto}
  .oculto{display:none!important}
  .cab{background:var(--menu);border:2.5px solid var(--navy);border-radius:18px;box-shadow:4px 5px 0 var(--navy);padding:18px 22px;margin-bottom:16px;color:#fff}
  .cab h1{margin:0;font-size:24px} .cab p{margin:6px 0 0;opacity:.9} .cab a{color:#fff}
  .caixa{border:2px solid var(--navy);border-radius:14px;padding:16px 18px;margin:0 0 14px;background:#fff}
  .caixa h2{margin:0 0 8px;font-size:17px}
  .aviso{color:var(--cinza);font-size:13.5px}
  .erro{color:var(--vermelho);background:#fdecec;border-radius:8px;padding:8px 10px;margin:6px 0}
  .ok{color:var(--verde)} .warn{color:var(--ocre)}
  button,.btn{font:inherit;font-size:14px;font-weight:bold;cursor:pointer;border:2px solid var(--navy);border-radius:10px;padding:7px 13px;background:#F5C518;color:var(--navy);text-decoration:none;display:inline-block}
  button.sec,.btn.sec{background:#fff} button.link{border:0;background:none;padding:0;color:var(--azul);text-decoration:underline;font-weight:normal}
  button:disabled{opacity:.55;cursor:default}
  .botoes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  input,select,textarea{font:inherit;font-size:14px;border:1.5px solid var(--linha);border-radius:8px;padding:6px 8px;width:100%;background:#fff;color:var(--navy)}
  label{font-size:12.5px;color:var(--cinza);display:block;margin-bottom:2px}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
  .chip{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--bloco);margin:0 4px 4px 0}
  .barra{height:9px;border-radius:5px;background:var(--bloco);overflow:hidden} .barra i{display:block;height:100%;background:var(--azul)}
  .area{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 80px;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--linha)}
  .item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--linha);padding:7px 0;font-size:14px}
  .item>div:first-child{flex:1 1 280px;min-width:0}
  .num{font-size:28px;font-weight:bold}
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .abas button[aria-pressed="true"]{background:var(--navy);color:#fff}
  table{border-collapse:collapse;width:100%;font-size:13.5px} td,th{border-bottom:1px solid var(--linha);padding:5px 6px;text-align:left;vertical-align:top}
  .tbox{overflow-x:auto}
  .carregando{color:var(--cinza)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab"><h1>📈 Progressão docente</h1><p>Planilha RAD, comprovantes e CCO, montados aos poucos. · <a href="aulas.html">voltar ao Aula por IA</a></p></div>
  <div class="abas"><button type="button" aria-pressed="true">Progressão</button><button type="button" class="sec" disabled title="Em breve">Plano de trabalho / relatório (em breve)</button></div>
  <div id="corpo"><p class="carregando">Carregando…</p></div>
</div>
<script>
var BACKEND_AULAS = 'https://script.google.com/macros/s/AKfycbyK-YXssnq1iBhqVAPMl4BlccH7eI1-0U9EqqOKV7vgK0qJSe9rgo51XZKxK45V2gOj/exec';
function tokenSalvo(){ try{ return localStorage.getItem('ip_token') || sessionStorage.getItem('ip_token') || ''; }catch(e){ return ''; } }
var token = tokenSalvo(), R = null, LIDO = null, CAL = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n, c){ return (Math.round(Number(n || 0) * Math.pow(10, c === undefined ? 2 : c)) / Math.pow(10, c === undefined ? 2 : c)).toString().replace('.', ','); }
function api(acao, dados){
  dados = dados || {}; dados.token = token;
  return fetch(BACKEND_AULAS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao: acao, dados: dados})})
    .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok){ if(j.erro === 'SESSAO') throw new Error('Sua sessão expirou. Entre de novo pelo Aula por IA.'); throw new Error(j.erro || 'Não deu para concluir.'); } return j.resultado; });
}
function lerArquivo(f){ return new Promise(function(ok, falha){ var fr = new FileReader(); fr.onload = function(){ ok(String(fr.result)); }; fr.onerror = falha; fr.readAsDataURL(f); }); }
var NOMES_AREA = {docencia: 'Docência', orientacoes: 'Orientações', outras: 'Outras atividades acadêmicas', artisticas: 'Atividades artísticas', complementares: 'Atividades complementares', extensao: 'Extensão', pesquisa: 'Pesquisa'};
var TETO_AREA = {docencia: 40, orientacoes: 20};
function rotuloChave(k){
  var c = R.catalogo; if(k === 'doc') return 'Disciplinas (relatório de turmas do Portal)';
  if(/^ori_/.test(k)) return 'Orientação: ' + ((c.orient[k.slice(4)] || [''])[0]);
  if(c.itens[k]) return c.itens[k][1]; if(c.cargos[k]) return c.cargos[k][0]; return k;
}
function abrir(){
  if(!token){ $('corpo').innerHTML = '<div class="caixa"><p>Entre na sua conta pelo <a href="aulas.html">Aula por IA</a> e volte aqui.</p></div>'; return; }
  api('progAbrir').then(function(r){ R = r; desenhar(); }).catch(function(e){ $('corpo').innerHTML = '<div class="caixa"><p class="erro">' + esc(e.message) + '</p></div>'; });
}
function desenhar(){
  var p = R.perfil, per = R.periodo, rs = R.resumo, h = '';
  // ---------- período e pontuação ----------
  if(per){
    h += '<div class="caixa"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div style="font-size:19px;font-weight:bold">' + esc(p.nivelAtual || '?') + ' → ' + esc(p.nivelPretendido || '?') + '</div>' +
      '<div class="aviso">período avaliado ' + esc(per.inicio) + ' a ' + esc(per.solicitacao) + ' · solicitação em ' + esc(per.solicitacao) + ' (dia e mês da admissão)</div></div>' +
      '<div style="text-align:right"><div class="num">' + (per.diasFaltam > 0 ? per.diasFaltam + ' dias' : 'já pode pedir') + '</div><div class="aviso">' + (per.diasFaltam > 0 ? 'até poder pedir' : '') + '</div></div></div>' +
      '<div style="margin-top:8px">' + [p.nome, p.siape && 'SIAPE ' + p.siape, (p.carreira || 'EBTT') + ' · ' + (p.regime || '40h / DE'), p.campus, p.colegiado, p.admissao && 'admissão ' + p.admissao, p.titulacao, p.instituicao].filter(Boolean).map(function(x){ return '<span class="chip">' + esc(x) + '</span>'; }).join('') +
      (R.pastaUrl ? ' <a class="chip" href="' + esc(R.pastaUrl) + '" target="_blank" rel="noopener">📁 pasta</a>' : '') + '</div></div>';
    var fora = rs.foraDocencia >= rs.minFora;
    h += '<div class="caixa"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end"><div><span class="aviso">pontuação RAD até agora</span><div class="num">' + num(rs.total) + ' <span style="font-size:16px" class="' + (rs.nota >= 3 ? 'ok' : 'warn') + '">nota ' + rs.nota + '</span></div></div>' +
      '<div style="font-size:13.5px;line-height:1.8"><div class="' + (rs.total >= (p.regime === '20h' ? 20 : 40) ? 'ok' : 'warn') + '">' + (rs.total >= (p.regime === '20h' ? 20 : 40) ? '✓' : '•') + ' ' + (p.regime === '20h' ? '20' : '40') + ' pontos ou mais (nota ≥ 3)</div>' +
      '<div class="' + (fora ? 'ok' : 'warn') + '">' + (fora ? '✓' : '•') + ' ' + rs.minFora + ' pontos fora da docência: ' + num(rs.foraDocencia) + '</div>' +
      (R.faltaCal.length ? '<div class="warn">• falta o calendário de ' + R.faltaCal.map(esc).join(', ') + '</div>' : '') + '</div></div>' +
      Object.keys(rs.areas).map(function(k){ var t = TETO_AREA[k] || 0, v = rs.areas[k];
        return '<div class="area"><span>' + NOMES_AREA[k] + (k === 'docencia' && rs.docBruta > 40 ? ' <span class="aviso">(' + num(rs.docBruta) + ' na média, limitado a 40)</span>' : '') + '</span><div class="barra"><i style="width:' + Math.min(100, t ? v / t * 100 : Math.min(100, v * 5)) + '%"></i></div><b>' + num(v) + (t ? ' / ' + t : '') + '</b></div>'; }).join('') +
      '<p class="aviso" style="margin:8px 0 0">Nota de produtividade (40h/DE): 45 ou mais = 4 · 40 a 44,9 = 3 · 20 a 39,9 = 2. A docência é a média por semestre do período (4 semestres), até 40; orientações até 20; os demais itens têm os tetos da planilha oficial.</p></div>';
  }
  // ---------- perfil ----------
  var incompleto = !per || !p.siape || !p.pastaId;
  h += '<details class="caixa"' + (incompleto ? ' open' : '') + '><summary style="cursor:pointer"><b>👤 Seu perfil</b> <span class="aviso">' + (incompleto ? '— complete para começar' : '— dados que mudam pouco') + '</span></summary>' +
    '<div class="grade" style="margin-top:10px">' + campo('nome', 'Nome completo', p.nome) + campo('siape', 'SIAPE (matrícula)', p.siape) + campo('admissao', 'Data de admissão (dd/mm/aaaa)', p.admissao) +
    sel('regime', 'Regime', p.regime || '40h / DE', ['40h / DE', '20h']) + sel('carreira', 'Carreira', p.carreira || 'EBTT', ['EBTT', 'MS']) + sel('campus', 'Unidade', p.campus || 'VA', ['MA', 'MG', 'NI', 'NF', 'PE', 'IT', 'AR', 'VA']) +
    campo('colegiado', 'Colegiado / lotação (ex.: CCEAL-VA)', p.colegiado) + campo('titulacao', 'Titulação', p.titulacao) + campo('nivelAtual', 'Nível atual (ex.: D4.1 ou D 401)', p.nivelAtual) +
    campo('nivelPretendido', 'Nível pretendido (ex.: D4.2)', p.nivelPretendido) + campo('anoProgressao', 'Ano da progressão (vazio = o próximo)', p.anoProgressao) + '</div>' +
    '<div style="margin-top:8px">' + campo('pastaLink', 'Link da sua pasta de progressão no Google Drive', p.pastaLink) + '<p class="aviso" style="margin:4px 0 0">A pasta é sua, no seu Drive. Se você não é o administrador, compartilhe-a com <b>miguelmeirelles@gmail.com</b> como <b>editor</b> antes de colar o link. A plataforma cria dentro dela a pasta do ciclo (ex.: "D4.1 para D4.2") e guarda os comprovantes.</p></div>' +
    '<div class="botoes"><button type="button" id="btPerfil">Salvar perfil</button><label class="btn sec" style="margin:0;color:var(--navy);font-size:14px">📥 Importar minha RAD anterior (.xlsx)<input type="file" id="impRad" accept=".xlsx" class="oculto"></label></div><div id="msgPerfil" class="aviso"></div></details>';
  if(per){
    // ---------- calendário ----------
    h += '<details class="caixa"' + (R.faltaCal.length ? ' open' : '') + '><summary style="cursor:pointer"><b>📅 Calendário acadêmico</b> <span class="aviso">— semanas de cada semestre (vale para todos os docentes do campus)</span></summary>' +
      (R.calendarios.length ? '<div class="tbox" style="margin-top:8px"><table><tr><th>Ano</th><th>Semestre</th><th>Nível</th><th>Semanas</th><th>Enviado por</th></tr>' + R.calendarios.sort(function(a, b){ return (b.ano - a.ano) || (a.semestre - b.semestre) || a.nivel.localeCompare(b.nivel); }).map(function(c){ return '<tr><td>' + c.ano + '</td><td>' + c.semestre + 'º</td><td>' + (c.nivel === 'G' ? 'Graduação' : 'Técnico/EPTNM') + '</td><td><b>' + c.semanas + '</b></td><td class="aviso">' + esc(c.por) + ' · ' + esc(c.em) + '</td></tr>'; }).join('') + '</table></div>' : '<p class="aviso">Nenhum calendário ainda.</p>') +
      (R.faltaCal.length ? '<p class="warn" style="margin:8px 0 0">Falta: ' + R.faltaCal.map(esc).join(', ') + '. Sem ele, a docência desses semestres não é calculada.</p>' : '') +
      '<div class="botoes"><label class="btn sec" style="margin:0;color:var(--navy);font-size:14px">📤 Enviar calendário (PDF)<input type="file" id="arqCal" accept="application/pdf,image/*" class="oculto"></label></div><div id="calBox"></div></details>';
    // ---------- enviar comprovante ----------
    h += '<div class="caixa"><h2>📎 Enviar comprovante</h2><p class="aviso" style="margin-top:0">PDF ou foto. A IA lê, classifica no item certo da planilha RAD e calcula os pontos (com os tetos e a proporção do tempo dentro do período). Você confere antes de salvar. Comece pelo relatório <b>"Turmas Ministradas por Docente para CPPD"</b> do Portal do Professor: ele preenche toda a docência.</p>' +
      (R.estrelas.length ? '<div class="aviso" style="margin-bottom:6px">Você costuma enviar: ' + R.estrelas.map(function(k){ return '<span class="chip">★ ' + esc(rotuloChave(k)) + '</span>'; }).join('') + '</div>' : '') +
      '<input type="file" id="arqComp" accept="application/pdf,image/*" multiple><div id="lidoBox"></div></div>';
    // ---------- itens lançados ----------
    h += '<div class="caixa"><h2>🧾 O que já está na sua RAD</h2>' + listaItens() + '<div class="botoes"><button type="button" class="sec" id="btManual">+ Lançar item à mão</button></div><div id="manualBox"></div></div>';
    // ---------- CCO ----------
    h += desenharCCO();
    h += '<div class="caixa" id="pacoteBox"><h2>📦 Pacote para a CCO</h2><p class="carregando">Carregando…</p></div>';
  }
  if(R.admin && R.adminDados) h += desenharAdmin();
  $('corpo').innerHTML = h;
  ligar();
  if(per) carregarPacote();
}
function campo(k, rot, v){ return '<div><label>' + rot + '</label><input data-pf="' + k + '" value="' + esc(v || '') + '"></div>'; }
function sel(k, rot, v, ops){ return '<div><label>' + rot + '</label><select data-pf="' + k + '">' + ops.map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
function descricaoItem(it){
  var d = it.dados || {}, c = R.catalogo;
  if(it.aba === 'doc') return '<b>' + esc(d.disciplina) + '</b> <span class="aviso">' + esc(d.semestre) + ' · ' + esc(d.nivel) + ' · ' + esc(d.ch) + ' h-a/sem · ' + esc(d.duracao) + ' · ' + esc(d.alunos) + ' alunos' + (it.info && it.info.semCal ? ' · <span class="warn">sem calendário</span>' : it.info ? ' · ' + it.info.semanasAtuacao + '/' + it.info.semanasTotal + ' semanas' : '') + '</span>';
  if(it.aba === 'ori') return '<b>' + esc((c.orient[d.tipo] || ['?'])[0]) + '</b>: ' + esc(d.nome) + (Number(d.orientadores) > 1 ? ' <span class="chip">coorientação</span>' : '') + ' <span class="aviso">' + esc(d.inicio || '') + (d.fim ? ' a ' + esc(d.fim) : '') + (d.descricao ? ' · ' + esc(d.descricao) : '') + '</span>';
  return '<b>' + esc(rotuloChave(it.chave)) + '</b> <span class="aviso">' + esc(d.descricao || '') + (d.quantidade !== undefined ? ' · qtd ' + esc(d.quantidade) : '') + (d.inicio ? ' · ' + esc(d.inicio) + (d.fim ? ' a ' + esc(d.fim) : '') : '') + '</span>';
}
function listaItens(){
  var grupos = {doc: 'Docência', ori: 'Orientações', out: 'Outras atividades acadêmicas', comp: 'Atividades complementares', pes: 'Pesquisa', ext: 'Extensão', art: 'Atividades artísticas'};
  if(!R.itens.length) return '<p class="aviso">Nada ainda. Envie o primeiro comprovante.</p>';
  return Object.keys(grupos).map(function(g){
    var l = R.itens.filter(function(it){ return it.aba === g; }); if(!l.length) return '';
    return '<p style="margin:12px 0 2px"><b>' + grupos[g] + '</b> <span class="aviso">(' + l.length + ')</span></p>' + l.map(function(it){
      return '<div class="item"><div>' + descricaoItem(it) + (it.arquivoNome ? '<div class="aviso">📄 ' + esc(it.arquivoNome) + '</div>' : '') + (it.origem === 'plataforma' ? '<div class="aviso">da plataforma (' + esc(it.documento) + ')</div>' : '') + '</div>' +
        '<div style="display:flex;gap:10px;align-items:center"><b>' + num(it.pts, 3) + '</b>' + (it.origem !== 'plataforma' ? '<button type="button" class="link" data-apagar="' + esc(it.id) + '">apagar</button>' : '') + '</div></div>';
    }).join('');
  }).join('') + '<p class="aviso" style="margin:8px 0 0">Pontos por item antes dos tetos. Na docência, o total da área é a soma dividida pelos 4 semestres.</p>';
}
// ---------- leitura de comprovante ----------
function enviarComprovantes(files){
  var fila = Array.prototype.slice.call(files), box = $('lidoBox');
  var proximo = function(){
    var f = fila.shift(); if(!f){ return; }
    if(f.size > 10 * 1024 * 1024){ box.insertAdjacentHTML('beforeend', '<div class="erro">' + esc(f.name) + ': grande demais (máx. 10 MB).</div>'); proximo(); return; }
    box.innerHTML = '<p class="carregando">Lendo "' + esc(f.name) + '" com a IA… (uns 20 a 40 s)' + (fila.length ? ' · faltam ' + fila.length : '') + '</p>';
    lerArquivo(f).then(function(b64){ return api('progAnalisar', {nome: f.name, dados: b64, mime: f.type || 'application/pdf'}); })
      .then(function(l){ LIDO = l; LIDO.fila = fila; desenharLido(proximo); })
      .catch(function(e){ box.innerHTML = '<div class="erro">' + esc(f.name) + ': ' + esc(e.message) + '</div>'; proximo(); });
  };
  proximo();
}
function opcoesChave(atual){
  var c = R.catalogo, h = '<option value="doc"' + (atual === 'doc' ? ' selected' : '') + '>Disciplina (docência)</option>';
  Object.keys(c.orient).forEach(function(t){ h += '<option value="ori_' + t + '"' + (atual === 'ori_' + t ? ' selected' : '') + '>Orientação: ' + esc(c.orient[t][0]) + '</option>'; });
  Object.keys(c.itens).forEach(function(k){ h += '<option value="' + k + '"' + (atual === k ? ' selected' : '') + '>' + esc(c.itens[k][1]) + '</option>'; });
  Object.keys(c.cargos).forEach(function(k){ h += '<option value="' + k + '"' + (atual === k ? ' selected' : '') + '>Cargo: ' + esc(c.cargos[k][0]) + '</option>'; });
  return h;
}
function linhaEditavel(it, i){
  var d = it.dados || {}, k = it.aba === 'doc' ? 'doc' : it.aba === 'ori' ? 'ori_' + d.tipo : it.chave, inp = function(c, rot, w){ return '<label style="display:inline-block;margin:0 6px 4px 0;width:' + (w || 110) + 'px">' + rot + '<input data-li="' + i + '" data-c="' + c + '" value="' + esc(d[c] === undefined ? '' : d[c]) + '"></label>'; };
  var campos = it.aba === 'doc' ? inp('disciplina', 'disciplina', 200) + inp('semestre', 'semestre', 80) + inp('nivel', 'nível', 60) + inp('ch', 'h-a/sem', 70) + inp('duracao', 'duração', 80) + inp('alunos', 'alunos', 70) + inp('docentes', 'docentes', 70)
    : it.aba === 'ori' ? inp('nome', 'aluno', 200) + inp('orientadores', 'nº orient.', 80) + inp('inicio', 'início', 100) + inp('fim', 'fim', 100)
    : R.catalogo.cargos[k] ? inp('descricao', 'descrição', 220) + inp('carga', 'h/semana', 80) + inp('semanas', 'semanas no período', 120)
    : inp('descricao', 'descrição', 220) + inp('quantidade', 'quantidade', 80) + inp('inicio', 'início', 100) + inp('fim', 'fim', 100);
  return '<div style="border-top:1px dashed var(--linha);padding:6px 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="checkbox" data-usar="' + i + '" checked style="width:18px;height:18px">' +
    '<select data-chave="' + i + '" style="max-width:420px">' + opcoesChave(k) + '</select><b>' + num(it.pts, 3) + ' pts</b></div><div style="margin:4px 0 0 26px">' + campos + '</div></div>';
}
function desenharLido(proximo){
  var l = LIDO, box = $('lidoBox');
  box.innerHTML = '<div style="background:var(--bloco);border-radius:10px;padding:10px 12px;margin-top:10px"><b>🤖 ' + esc(l.documento || l.arquivoNome) + '</b> <a class="aviso" href="' + esc(l.arquivoUrl) + '" target="_blank" rel="noopener">abrir</a>' +
    (l.resumo ? '<div class="aviso">' + esc(l.resumo) + '</div>' : '') + (l.duvida ? '<div class="warn" style="margin-top:4px">⚠ ' + esc(l.duvida) + '</div>' : '') +
    (l.itens.length ? l.itens.map(linhaEditavel).join('') : '<p class="warn">A IA não achou nenhum item da RAD neste documento. Lance à mão se precisar.</p>') +
    '<div class="botoes"><button type="button" id="btSalvarLido"' + (l.itens.length ? '' : ' disabled') + '>✓ Confirmar e salvar</button><button type="button" class="sec" id="btDescLido">Descartar</button></div><div id="msgLido" class="aviso"></div></div>';
  var coletar = function(){
    return l.itens.map(function(it, i){
      if(!box.querySelector('[data-usar="' + i + '"]').checked) return null;
      var k = box.querySelector('[data-chave="' + i + '"]').value, d = JSON.parse(JSON.stringify(it.dados || {}));

  var assunto = 'Documentação para progressão ' + (p.perfil.nome || '').split(' ')[0];
  return '<details style="margin-top:10px"><summary style="cursor:pointer"><b>✉ E-mail para a CCO</b> <span class="aviso">(você envia do seu e-mail; a plataforma não envia)</span></summary>' +
    '<p class="aviso" style="margin:6px 0 2px">Para: ' + esc(cco.map(function(c){ return c.nome + (c.email ? ' <' + c.email + '>' : ' (sem e-mail na lista)'); }).join(', ')) + '<br>Assunto: <b>' + esc(assunto) + '</b></p>' +
    '<textarea rows="8" id="txtEmailCCO">' + esc(corpo) + '</textarea><div class="botoes"><a class="btn sec" id="lnkMail" href="mailto:' + encodeURIComponent(mails.join(',')) + '?subject=' + encodeURIComponent(assunto) + '&body=' + encodeURIComponent(corpo) + '">Abrir no meu e-mail</a></div>' +
    '<p class="aviso">Anexe os arquivos 1 a 6 da pasta do ciclo.</p></details>';
}
function carregarPdfLib(){
  if(window.PDFLib) return Promise.resolve();
  return new Promise(function(ok, falha){ var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; s.onload = ok; s.onerror = function(){ falha(new Error('Não deu para carregar o montador de PDF. Verifique a internet.')); }; document.head.appendChild(s); });
}
function b64ParaBytes(b){ var s = atob(b), u = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function bytesParaB64(u){ var s = '', t = 0x8000; for(var i = 0; i < u.length; i += t) s += String.fromCharCode.apply(null, u.subarray(i, i + t)); return btoa(s); }
function imagemParaPdf(f){
  return carregarPdfLib().then(function(){ return lerArquivo(f); }).then(function(u){
    var L = PDFLib; return L.PDFDocument.create().then(function(doc){
      var bytes = b64ParaBytes(u.split(',')[1]); return (/png/.test(f.type) ? doc.embedPng(bytes) : doc.embedJpg(bytes)).then(function(img){
        var pg = doc.addPage([595, 842]), e = Math.min(555 / img.width, 802 / img.height); pg.drawImage(img, {x: (595 - img.width * e) / 2, y: (842 - img.height * e) / 2, width: img.width * e, height: img.height * e});
        return doc.save(); }); }).then(function(b){ return bytesParaB64(b); }); });
}
// 4 · todos os comprovantes num PDF só, na ordem da planilha RAD
function montarComprovantes(msg){
  return carregarPdfLib().then(function(){ return PDFLib.PDFDocument.create(); }).then(function(saida){
    var lista = PAC.comprovantes.slice(), i = 0, falhas = [];
    var proximo = function(){
      var c = lista[i++]; if(!c) return Promise.resolve();
      msg('Juntando ' + i + ' de ' + lista.length + ': ' + esc(c.nome) + '…');
      return api('progArquivo', {id: c.id}).then(function(a){
        var bytes = b64ParaBytes(a.dados);
        if(/pdf/.test(a.mime)) return PDFLib.PDFDocument.load(bytes, {ignoreEncryption: true}).then(function(d){ return saida.copyPages(d, d.getPageIndices()); }).then(function(pgs){ pgs.forEach(function(p){ saida.addPage(p); }); });
        if(/image\/(png|jpe?g)/.test(a.mime)) return (/png/.test(a.mime) ? saida.embedPng(bytes) : saida.embedJpg(bytes)).then(function(img){ var pg = saida.addPage([595, 842]), e = Math.min(555 / img.width, 802 / img.height); pg.drawImage(img, {x: (595 - img.width * e) / 2, y: (842 - img.height * e) / 2, width: img.width * e, height: img.height * e}); });
        falhas.push(c.nome);
      }).catch(function(){ falhas.push(c.nome); }).then(proximo);
    };
    return proximo().then(function(){ msg('Salvando o PDF no Drive…'); return saida.save(); }).then(function(b){
      return api('progSalvarGerado', {nome: '4 - Comprovantes da RAD.pdf', dados: bytesParaB64(b), mime: 'application/pdf'}); })
      .then(function(){ if(falhas.length) alert('Não deu para incluir: ' + falhas.join(', ') + '. Confira esses arquivos.'); });
  });
}
// 5 · formulário oficial da CCO com a identificação escrita nas posições do modelo
function preencherCCO(msg){
  var p = PAC, pf = p.perfil, cco = p.cco, ch = p.chefia || {};
  msg('Baixando o formulário oficial…');
  return carregarPdfLib().then(function(){ return api('progArquivo', {id: p.modelos.cco}); }).then(function(a){ return PDFLib.PDFDocument.load(b64ParaBytes(a.dados), {ignoreEncryption: true}); }).then(function(doc){
    return doc.embedFont(PDFLib.StandardFonts.Helvetica).then(function(f){
      var pgs = doc.getPages(), t = function(pg, x, y, s, tam){ if(s) pgs[pg].drawText(String(s), {x: x, y: y, size: tam || 10, font: f}); };
      var adm = String(pf.admissao || '').split('/'), cidade = {VA: 'Valença-RJ', MA: 'Rio de Janeiro-RJ', MG: 'Rio de Janeiro-RJ', NI: 'Nova Iguaçu-RJ', NF: 'Nova Friburgo-RJ', PE: 'Petrópolis-RJ', IT: 'Itaguaí-RJ', AR: 'Angra dos Reis-RJ'}[pf.campus] || pf.campus;
      t(0, 166, 642, pf.nome); t(0, 462, 642, pf.siape);
      if(pf.regime !== '20h') t(0, 295, 617, 'x'); if((pf.carreira || 'EBTT') === 'EBTT') t(0, 82, 595, 'x');
      t(0, 456, 620, adm[0], 11); t(0, 479, 620, adm[1], 11); t(0, 502, 620, adm[2], 11); t(0, 180, 577, cidade); t(0, 401, 577, pf.colegiado);
      t(2, 67, 590, 'x', 11);
      [515, 495, 475].forEach(function(y, i){ var m = cco[i] || {}; t(2, 44, y, m.nome, 8.5); t(2, 295, y, m.lotacao, 9); t(2, 365, y, m.titulacao, 9); t(2, 431, y, m.admissao, 9); });
      [[360, 359], [322, 322], [288, 289]].forEach(function(y, i){ var m = cco[i] || {}; t(2, 100, y[0], m.nome); t(2, 483, y[1], m.siape); });
      t(2, 160, 256, ch.nome); t(2, 488, 130, ch.siape); t(2, 490, 57, pf.siape);
      msg('Salvando no Drive…'); return doc.save();
    });
  }).then(function(b){ return api('progSalvarGerado', {nome: '5 - CCO-AVALIACAO-PARECER (preenchido).pdf', dados: bytesParaB64(b), mime: 'application/pdf'}); });
}
