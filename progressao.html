<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progressão docente — Aula por IA</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root{--menu:#17389C;--azul:#2E62C6;--navy:#0E2A5C;--bloco:#EFF1F5;--cinza:#5b6b86;--verde:#1a7a3c;--vermelho:#8a1c1c;--ocre:#8a6100;--linha:#d7deea}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:Arial,Helvetica,sans-serif;color:var(--navy);background:#fff;font-size:15px;line-height:1.45}
  .wrap{max-width:980px;margin:0 auto}
  .oculto{display:none!important}
  .cab{background:var(--menu);border:2.5px solid var(--navy);border-radius:18px;box-shadow:4px 5px 0 var(--navy);padding:18px 22px;margin-bottom:16px;color:#fff}
  .cab h1{margin:0;font-size:24px} .cab p{margin:6px 0 0;opacity:.9} .cab a{color:#fff}
  .caixa{border:2px solid var(--navy);border-radius:14px;padding:16px 18px;margin:0 0 14px;background:#fff}
  .caixa h2{margin:0 0 8px;font-size:17px}
  .aviso{color:var(--cinza);font-size:13.5px}
  .erro{color:var(--vermelho);background:#fdecec;border-radius:8px;padding:8px 10px;margin:6px 0}
  .ok{color:var(--verde)} .warn{color:var(--ocre)}
  button,.btn{font:inherit;font-size:14px;font-weight:bold;cursor:pointer;border:2px solid var(--navy);border-radius:10px;padding:7px 13px;background:#F5C518;color:var(--navy);text-decoration:none;display:inline-block}
  button.sec,.btn.sec{background:#fff} button.link{border:0;background:none;padding:0;color:var(--azul);text-decoration:underline;font-weight:normal}
  button:disabled{opacity:.55;cursor:default}
  .botoes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
  input,select,textarea{font:inherit;font-size:14px;border:1.5px solid var(--linha);border-radius:8px;padding:6px 8px;width:100%;background:#fff;color:var(--navy)}
  label{font-size:12.5px;color:var(--cinza);display:block;margin-bottom:2px}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
  .chip{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--bloco);margin:0 4px 4px 0}
  .barra{height:9px;border-radius:5px;background:var(--bloco);overflow:hidden} .barra i{display:block;height:100%;background:var(--azul)}
  .area{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 80px;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--linha)}
  .item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--linha);padding:7px 0;font-size:14px}
  .item>div:first-child{flex:1 1 280px;min-width:0}
  .num{font-size:28px;font-weight:bold}
  .abas{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .abas button[aria-pressed="true"]{background:var(--navy);color:#fff}
  table{border-collapse:collapse;width:100%;font-size:13.5px} td,th{border-bottom:1px solid var(--linha);padding:5px 6px;text-align:left;vertical-align:top}
  .tbox{overflow-x:auto}
  .carregando{color:var(--cinza)}
  .mudou{background:#fff3b0;border-radius:6px;transition:background 1.2s} .barra i{transition:width .7s ease}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab"><h1>📈 Progressão docente</h1><p>Planilha RAD, comprovantes e CCO, montados aos poucos. · <a href="aulas.html">voltar ao Aula por IA</a></p></div>
  <div class="abas"><button type="button" data-aba="prog" aria-pressed="true">Progressão</button><button type="button" class="sec" disabled title="Em breve">Plano de trabalho / relatório (em breve)</button><button type="button" class="sec" data-aba="cco" aria-pressed="false">🧑‍⚖️ Sou membro de CCO</button></div>
  <div id="corpo"><p class="carregando">Carregando…</p></div>
</div>
<script>
var BACKEND_AULAS = 'https://script.google.com/macros/s/AKfycbyK-YXssnq1iBhqVAPMl4BlccH7eI1-0U9EqqOKV7vgK0qJSe9rgo51XZKxK45V2gOj/exec';
function tokenSalvo(){ try{ return localStorage.getItem('ip_token') || sessionStorage.getItem('ip_token') || ''; }catch(e){ return ''; } }
var token = tokenSalvo(), R = null, LIDO = null, CAL = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n, c){ return (Math.round(Number(n || 0) * Math.pow(10, c === undefined ? 2 : c)) / Math.pow(10, c === undefined ? 2 : c)).toString().replace('.', ','); }
function api(acao, dados){
  dados = dados || {}; dados.token = token;
  return fetch(BACKEND_AULAS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao: acao, dados: dados})})
    .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok){ if(j.erro === 'SESSAO') throw new Error('Sua sessão expirou. Entre de novo pelo Aula por IA.'); throw new Error(j.erro || 'Não deu para concluir.'); } return j.resultado; });
}
function lerArquivo(f){ return new Promise(function(ok, falha){ var fr = new FileReader(); fr.onload = function(){ ok(String(fr.result)); }; fr.onerror = falha; fr.readAsDataURL(f); }); }
var NOMES_AREA = {docencia: 'Docência', orientacoes: 'Orientações', outras: 'Outras atividades acadêmicas', artisticas: 'Atividades artísticas', complementares: 'Atividades complementares', extensao: 'Extensão', pesquisa: 'Pesquisa'};
var TETO_AREA = {docencia: 40, orientacoes: 20};
function rotuloChave(k){
  var c = R.catalogo; if(k === 'doc') return 'Disciplinas (relatório de turmas do Portal)';
  if(/^ori_/.test(k)) return 'Orientação: ' + ((c.orient[k.slice(4)] || [''])[0]);
  if(c.itens[k]) return c.itens[k][1]; if(c.cargos[k]) return c.cargos[k][0]; return k;
}
function abrir(){
  if(!token){ $('corpo').innerHTML = '<div class="caixa"><p>Entre na sua conta pelo <a href="aulas.html">Aula por IA</a> e volte aqui.</p></div>'; return; }
  api('progAbrir').then(function(r){ R = r; desenhar(); }).catch(function(e){ $('corpo').innerHTML = '<div class="caixa"><p class="erro">' + esc(e.message) + '</p></div>'; });
}
function desenhar(){
  var p = R.perfil, per = R.periodo, rs = R.resumo, h = '';
  // ---------- período e pontuação ----------
  if(per){
    h += '<div class="caixa"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div style="font-size:19px;font-weight:bold">' + esc((converterNivel(p.nivelAtual) || {}).rotulo || p.nivelAtual || '?') + ' → ' + esc((converterNivel(p.nivelPretendido || proximoNivel(p.nivelAtual)) || {}).rotulo || p.nivelPretendido || '?') + '</div>' + ((converterNivel(p.nivelAtual) || {}).antigo ? '<div class="aviso">código antigo: ' + esc(converterNivel(p.nivelAtual).antigo) + ' → ' + esc((converterNivel(p.nivelPretendido || proximoNivel(p.nivelAtual)) || {}).antigo || '') + '</div>' : '') +
      '<div class="aviso">período avaliado ' + esc(per.inicio) + ' a ' + esc(per.solicitacao) + ' · solicitação em ' + esc(per.solicitacao) + ' (dia e mês da admissão)</div></div>' +
      '<div style="text-align:right"><div class="num">' + (per.diasFaltam > 0 ? per.diasFaltam + ' dias' : 'já pode pedir') + '</div><div class="aviso">' + (per.diasFaltam > 0 ? 'até poder pedir' : '') + '</div></div></div>' +
      '<div style="margin-top:8px">' + [p.nome, p.siape && 'SIAPE ' + p.siape, (p.carreira || 'EBTT') + ' · ' + (p.regime || '40h / DE'), p.campus, p.colegiado, p.admissao && 'admissão ' + p.admissao, p.titulacao, p.instituicao].filter(Boolean).map(function(x){ return '<span class="chip">' + esc(x) + '</span>'; }).join('') +
      (R.pastaUrl ? ' <a class="chip" href="' + esc(R.pastaUrl) + '" target="_blank" rel="noopener">📁 pasta</a>' : '') + '</div></div>';
    h += htmlPlacar();
  }
  // ---------- perfil ----------
  var incompleto = !per || !p.siape || (!p.pastaId && !R.admin);
  h += '<details class="caixa"' + (incompleto ? ' open' : '') + '><summary style="cursor:pointer"><b>👤 Seu perfil</b> <span class="aviso">' + (incompleto ? '— complete para começar' : '— dados que mudam pouco') + '</span></summary>' +
    '<div class="grade" style="margin-top:10px">' + campo('nome', 'Nome completo', p.nome) + campo('siape', 'SIAPE (matrícula)', p.siape) + campo('email', 'E-mail institucional', p.email) + campo('celular', 'Celular, ex.: (24) 98183-9748', p.celular) + campo('telefone', 'Telefone (opcional)', p.telefone) + campo('admissao', 'Data de admissão (dd/mm/aaaa)' + (p.admissao && !/\d{4}/.test(p.admissao) ? ' — falta o ano' : ''), p.admissao) +
    sel('regime', 'Regime', p.regime || '40h / DE', ['40h / DE', '40h', '20h']) + sel('carreira', 'Carreira', p.carreira || 'EBTT', ['EBTT', 'MS']) + sel('campus', 'Unidade', p.campus || 'VA', ['MA', 'MG', 'NI', 'NF', 'PE', 'IT', 'AR', 'VA']) +
    campo('colegiado', 'Colegiado / lotação (ex.: CCEAL-VA)', p.colegiado) + campo('titulacao', 'Titulação', p.titulacao) + campoNivel('nivelAtual', 'Nível atual (antigo D 401 / D4.1 ou novo C1)', p.nivelAtual) +
    campoNivel('nivelPretendido', 'Nível pretendido (vazio = o próximo)', p.nivelPretendido || proximoNivel(p.nivelAtual)) + campo('anoProgressao', 'Ano da progressão (vazio = o próximo)', p.anoProgressao) + '</div>' +
    '<div style="margin-top:8px">' + campo('pastaLink', 'Link da sua pasta de progressão no Google Drive' + (R.admin ? ' (opcional)' : ''), p.pastaLink) + '<p class="aviso" style="margin:4px 0 0">' + (R.admin ? 'Opcional: se ficar em branco, a plataforma cria a pasta "Progressão docente (Aula por IA)" no seu Drive. Se colar a sua pasta de progressões, ela usa a do ciclo que já existe lá (ex.: "D4.1 para D4.2") — escreva os níveis do mesmo jeito do nome da pasta.' : 'A pasta é sua, no seu Drive: compartilhe-a com <b>miguelmeirelles@gmail.com</b> como <b>editor</b> antes de colar o link. A plataforma cria dentro dela a pasta do ciclo (ex.: "D4.1 para D4.2") e guarda os comprovantes.') + '</p></div>' +
    '<div class="botoes"><button type="button" id="btPerfil">Salvar perfil</button><label class="btn sec" style="margin:0;color:var(--navy);font-size:14px">📥 Importar minha RAD anterior (.xlsx)<input type="file" id="impRad" accept=".xlsx" class="oculto"></label></div><div id="msgPerfil" class="aviso"></div></details>';
  if(per){
    // ---------- calendário ----------
    h += '<details class="caixa"' + (R.faltaCal.length ? ' open' : '') + '><summary style="cursor:pointer"><b>📅 Calendário acadêmico</b> <span class="aviso">— semanas de cada semestre (vale para todos os docentes do campus)</span></summary>' +
      (R.calendarios.length ? '<div class="tbox" style="margin-top:8px"><table><tr><th>Ano</th><th>Semestre</th><th>Nível</th><th>Semanas</th><th>Enviado por</th></tr>' + R.calendarios.sort(function(a, b){ return (b.ano - a.ano) || (a.semestre - b.semestre) || a.nivel.localeCompare(b.nivel); }).map(function(c){ return '<tr><td>' + c.ano + '</td><td>' + c.semestre + 'º</td><td>' + (c.nivel === 'G' ? 'Graduação' : 'Técnico/EPTNM') + '</td><td><b>' + c.semanas + '</b></td><td class="aviso">' + esc(c.por) + ' · ' + esc(c.em) + '</td></tr>'; }).join('') + '</table></div>' : '<p class="aviso">Nenhum calendário ainda.</p>') +
      (R.faltaCal.length ? '<p class="warn" style="margin:8px 0 0">Falta: ' + R.faltaCal.map(esc).join(', ') + '. Sem ele, a docência desses semestres não é calculada.</p>' : '') +
      '<div class="botoes"><label class="btn sec" style="margin:0;color:var(--navy);font-size:14px">📤 Enviar calendário (PDF)<input type="file" id="arqCal" accept="application/pdf,image/*" class="oculto"></label></div><div id="calBox"></div></details>';
    // ---------- enviar comprovante ----------
    h += '<div class="caixa"><h2>📎 Enviar comprovante</h2><p class="aviso" style="margin-top:0">PDF ou foto. A IA lê, classifica no item certo da planilha RAD e calcula os pontos (com os tetos e a proporção do tempo dentro do período). Você confere antes de salvar. Comece pelo relatório <b>"Turmas Ministradas por Docente para CPPD"</b> do Portal do Professor: ele preenche toda a docência.</p>' +
      (R.estrelas.length ? '<div class="aviso" style="margin-bottom:6px">Você costuma enviar: ' + R.estrelas.map(function(k){ return '<span class="chip">★ ' + esc(rotuloChave(k)) + '</span>'; }).join('') + '</div>' : '') +
      '<input type="file" id="arqComp" accept="application/pdf,image/*" multiple>' +
      '<div class="botoes"><button type="button" class="sec" id="btVarredura">🔎 Fazer varredura de documentos compartilhados</button></div>' +
      '<p class="aviso" style="margin:4px 0 0">Atas de defesa, artigos, portarias de NDE/comissão, ofícios de CCO… que outro docente já enviou e em que você aparece (até 3 anos). O arquivo vem para a sua pasta e entra pela leitura normal. Nada é enviado por e-mail.</p>' +
      '<div id="varBox"></div><div id="lidoBox"></div></div>';
    // ---------- itens lançados ----------
    h += htmlDocs();
    h += '<div class="caixa"><h2>🧾 O que já está na sua RAD</h2><div id="listaItensBox">' + listaItens() + '</div>' + '<div class="botoes"><button type="button" class="sec" id="btManual">+ Lançar item à mão</button></div><div id="manualBox"></div></div>';
    // ---------- CCO ----------
    h += desenharCCO();
    h += '<div class="caixa" id="pacoteBox"><h2>📦 Pacote para a CCO</h2><p class="carregando">Carregando…</p></div>';
  }
  if(R.admin && R.adminDados) h += desenharAdmin();
  $('corpo').innerHTML = h;
  ligar(); ligarV197();
  if(per) carregarPacote();
}
function htmlPlacar(){ var p = R.perfil, per = R.periodo, rs = R.resumo, h = '';
    var fora = rs.foraDocencia >= rs.minFora;
    h += '<div class="caixa" id="placar"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end"><div><span class="aviso">pontuação RAD até agora</span><div class="num"><span id="plTotal">' + num(rs.total) + '</span> <span style="font-size:16px" class="' + (rs.nota >= 3 ? 'ok' : 'warn') + '">nota ' + rs.nota + '</span></div></div>' +
      '<div style="font-size:13.5px;line-height:1.8"><div class="' + (rs.total >= (p.regime === '20h' ? 20 : 40) ? 'ok' : 'warn') + '">' + (rs.total >= (p.regime === '20h' ? 20 : 40) ? '✓' : '•') + ' ' + (p.regime === '20h' ? '20' : '40') + ' pontos ou mais (nota ≥ 3)</div>' +
      '<div class="' + (fora ? 'ok' : 'warn') + '">' + (fora ? '✓' : '•') + ' ' + rs.minFora + ' pontos fora da docência: ' + num(rs.foraDocencia) + '</div>' +
      (R.faltaCal.length ? '<div class="warn">• falta o calendário de ' + R.faltaCal.map(esc).join(', ') + '</div>' : '') + '</div></div>' +
      Object.keys(rs.areas).map(function(k){ var t = TETO_AREA[k] || 0, v = rs.areas[k];
        return '<div class="area"><span>' + NOMES_AREA[k] + (k === 'docencia' && rs.docBruta > 40 ? ' <span class="aviso">(' + num(rs.docBruta) + ' na média, limitado a 40)</span>' : '') + '</span><div class="barra"><i style="width:' + Math.min(100, t ? v / t * 100 : Math.min(100, v * 5)) + '%"></i></div><b><span id="pl_' + k + '">' + num(v) + '</span>' + (t ? ' / ' + t : '') + '</b></div>'; }).join('') +
      '<p class="aviso" style="margin:8px 0 0">Nota de produtividade (40h/DE): 45 ou mais = 4 · 40 a 44,9 = 3 · 20 a 39,9 = 2. A docência é a média por semestre do período (4 semestres), até 40; orientações até 20; os demais itens têm os tetos da planilha oficial.</p></div>';
  return h; }
function htmlDocs(){ var h = '';
    var docs = R.documentos || [], soltos = docs.filter(function(d){ return !d.itens; }), copias = docs.filter(function(d){ return d.copiaDe; });
    if(docs.length) h += '<details id="docsBox" class="caixa"' + (soltos.length || copias.length ? ' open' : '') + '><summary style="cursor:pointer"><b>📂 Documentos enviados</b> <span class="aviso">(' + docs.length + (soltos.length ? ' · <span class="warn">' + soltos.length + ' sem itens</span>' : '') + (copias.length ? ' · <span class="warn">⚠ ' + copias.length + ' repetido(s)</span>' : '') + ')</span></summary>' +
      docs.map(function(d){ return '<div class="item"><div><a href="' + esc(d.url) + '" target="_blank" rel="noopener">📄 ' + esc(d.nome) + '</a> <span class="aviso">' + esc(d.em) + ' · ' + (d.itens ? d.itens + ' item(ns) na RAD' : '<span class="warn">sem itens — foi lido e não confirmado</span>') + '</span>' + (d.copiaDe ? '<div class="warn" style="font-weight:600">⚠ Arquivo repetido: tem o mesmo conteúdo de "' + esc(d.copiaDe) + '"' + (d.copiaComItens ? ' — os dois têm itens, então contam em dobro na RAD. Veja em "O que já está na sua RAD" qual leitura está certa (ex.: 50 min) e apague o arquivo da outra.' : '. Apague esta cópia.') + '</div>' : '') + '</div><button type="button" class="link" data-apagarq="' + esc(d.id) + '" data-n="' + d.itens + '">apagar</button></div>'; }).join('') +
      (copias.length ? '<div class="erro" style="background:#fff7d6;color:var(--navy)">⚠ ' + copias.length + ' arquivo(s) repetido(s) na pasta (mesmo conteúdo de outro). Apagando a cópia, os itens dela saem junto.</div>' : '') + '<p class="aviso" style="margin:6px 0 0">Documento sem itens não entra no PDF dos comprovantes. Se for um comprovante que vale, envie de novo e confirme; se for cópia, apague.</p></details>';
  return h || '<div id="docsBox"></div>'; }
// depois de salvar ou apagar: troca só o placar, os documentos e a lista; os números sobem até o valor novo
function atualizarParcial(r){
  var antes = R && R.resumo ? JSON.parse(JSON.stringify(R.resumo)) : null; R = r;
  var pl = $('placar'); if(!pl){ desenhar(); return; }
  pl.outerHTML = htmlPlacar();
  var db = $('docsBox'); if(db) db.outerHTML = htmlDocs();
  var li = $('listaItensBox'); if(li) li.innerHTML = listaItens();
  ligarListas();
  if(!antes) return;
  var animar = function(id, de, para){ var el = $(id); if(!el || Math.abs(de - para) < 0.005) return; var t0 = performance.now(), dur = 700;
    el.parentNode.classList.add('mudou');
    (function passo(t){ var f = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - f, 3); el.textContent = num(de + (para - de) * e); if(f < 1) requestAnimationFrame(passo); })(t0);
    setTimeout(function(){ if(el.parentNode) el.parentNode.classList.remove('mudou'); }, 1600); };
  animar('plTotal', antes.total, R.resumo.total);
  Object.keys(R.resumo.areas).forEach(function(k){ animar('pl_' + k, antes.areas[k] || 0, R.resumo.areas[k]); });
}
function campoNivel(k, rot, v){ var c = converterNivel(v); return '<div><label>' + rot + '</label><input data-pf="' + k + '" value="' + esc(v || '') + '">' + (c ? '<div class="aviso" style="margin-top:2px">= <b>' + esc(c.rotulo) + '</b>' + (c.antigo && c.antigo !== 'Titular' ? ' (antigo ' + esc(c.antigo) + ')' : '') + '</div>' : v ? '<div class="warn" style="font-size:12.5px">não reconheci o código</div>' : '') + '</div>'; }
function campo(k, rot, v){ return '<div><label>' + rot + '</label><input data-pf="' + k + '" value="' + esc(v || '') + '"></div>'; }
function sel(k, rot, v, ops){ return '<div><label>' + rot + '</label><select data-pf="' + k + '">' + ops.map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
function descricaoItem(it){
  var d = it.dados || {}, c = R.catalogo;
  if(it.aba === 'doc') return '<b>' + esc(d.disciplina) + '</b> <span class="aviso">' + esc(d.semestre) + ' · ' + esc(d.nivel) + ' · ' + esc(d.ch) + ' h-a/sem · ' + esc(d.duracao) + ' · ' + esc(d.alunos) + ' alunos' + (it.info && it.info.semCal ? ' · <span class="aviso">semestre inteiro (sem calendário)</span>' : it.info ? ' · ' + it.info.semanasAtuacao + '/' + it.info.semanasTotal + ' semanas' : '') + '</span>';
  if(it.aba === 'ori') return '<b>' + esc((c.orient[d.tipo] || ['?'])[0]) + '</b>: ' + esc(d.nome) + (Number(d.orientadores) > 1 ? ' <span class="chip">coorientação</span>' : '') + ' <span class="aviso">' + esc(d.inicio || '') + (d.fim ? ' a ' + esc(d.fim) : '') + (d.descricao ? ' · ' + esc(d.descricao) : '') + '</span>';
  return '<b>' + esc(rotuloChave(it.chave)) + '</b> <span class="aviso">' + esc(d.descricao || '') + (d.quantidade !== undefined ? ' · qtd ' + esc(d.quantidade) : '') + (d.inicio ? ' · ' + esc(d.inicio) + (d.fim ? ' a ' + esc(d.fim) : '') : '') + '</span>';
}
function listaItens(){
  var grupos = {doc: 'Docência', ori: 'Orientações', out: 'Outras atividades acadêmicas', comp: 'Atividades complementares', pes: 'Pesquisa', ext: 'Extensão', art: 'Atividades artísticas'};
  if(!R.itens.length) return '<p class="aviso">Nada ainda. Envie o primeiro comprovante.</p>';

          $('btManter').addEventListener('click', function(){ box.innerHTML = ''; proximo(); });
          $('btSubst').addEventListener('click', function(){ box.innerHTML = '<p class="carregando">Lendo de novo "' + esc(f.name) + '"…</p>';
            api('progAnalisar', {nome: f.name, dados: b64guardado, mime: f.type || 'application/pdf', substituir: true}).then(function(l2){ LIDO = l2; LIDO.fila = fila; desenharLido(proximo); }).catch(function(e){ box.innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; proximo(); }); });

function ptsLinha(k, d, info){

  if(/^ori_/.test(k)){ var t = c.orient[k.slice(4)] || [0, 0]; var fr = info && info.semanasTotal ? Math.min(1, (info.semanasPeriodo || info.semanasTotal) / info.semanasTotal) : 1; return t[1] * fr / (n(d.orientadores) || 1); }

// Níveis da carreira EBTT: aceita o código antigo (D 401, DIV.1, D4.1, D IV 1…) ou o novo (C1, Classe C nível 1) e
// devolve a nomenclatura nova (MP 1.286/2024): D IV → Classe C · D III → Classe B · D II → Classe A (nível único) ·
// D I → extinto (ingressa na A) · Titular → Titular. Os níveis 1 a 4 das classes B e C não mudam.
function converterNivel(txt) {
  var t = String(txt || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/CLASSE|NIVEL|NÍVEL/g, '').replace(/[\s.\-–_\/]/g, '');
  if (!t) return null;
  if (/^TITULAR/.test(t)) return { classe: 'Titular', nivel: 0, rotulo: 'Titular', curto: 'Titular', antigo: 'Titular' };
  var rom = { IV: 4, III: 3, II: 2, I: 1 }, m = t.match(/^D(IV|III|II|I|[1-4])0?([1-4])$/), cl = 0, nv = 0;
  if (m) { cl = rom[m[1]] || Number(m[1]); nv = Number(m[2]); }
  else { var n = t.match(/^([ABC])([1-4])?$/); if (!n) return null; cl = { A: 2, B: 3, C: 4 }[n[1]]; nv = Number(n[2] || 1); }
  var letra = { 4: 'C', 3: 'B', 2: 'A', 1: 'A' }[cl], nivelNovo = cl <= 2 ? 1 : nv;
  var romano = { 4: 'IV', 3: 'III', 2: 'II', 1: 'I' }[cl];
  return { classe: letra, nivel: nivelNovo, rotulo: 'Classe ' + letra + ' – Nível ' + nivelNovo + (cl <= 2 ? ' (único)' : ''), curto: letra + nivelNovo, antigo: 'D ' + romano + ' – ' + nv, antigoCurto: 'D' + cl + '.' + nv };
}
function proximoNivel(txt) {
  var c = converterNivel(txt); if (!c) return '';
  if (c.classe === 'Titular') return '';
  if (c.classe === 'A') return 'Classe B – Nível 1';
  if (c.nivel < 4) return 'Classe ' + c.classe + ' – Nível ' + (c.nivel + 1);
  return c.classe === 'B' ? 'Classe C – Nível 1' : 'Titular';
}

// preenche o protocolo da CPPD (docx com campos de formulário antigos do Word): textos em ordem, caixas em ordem, campus
function preencherProtocoloXml(xml, textos, caixas, campusIdx) {
  var i = 0, pos = 0;
  while (true) {
    var k = xml.indexOf('FORMTEXT', pos); if (k < 0) break;
    var sepTag = '<w:fldChar w:fldCharType="separate"/>', endTag = '<w:fldChar w:fldCharType="end"/>';
    var s = xml.indexOf(sepTag, k), e = xml.indexOf(endTag, s); if (s < 0 || e < 0) break;
    var sFim = xml.indexOf('</w:r>', s) + 6, eIni = xml.lastIndexOf('<w:r', e);
    var seg = xml.slice(sFim, eIni), rpr = (seg.match(/<w:rPr>[\s\S]*?<\/w:rPr>/) || [''])[0];
    var v = textos[i] === undefined || textos[i] === null || textos[i] === '' ? '     ' : String(textos[i]);
    v = v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var novo = '<w:r>' + rpr + '<w:t xml:space="preserve">' + v + '</w:t></w:r>';
    xml = xml.slice(0, sFim) + novo + xml.slice(eIni);
    pos = sFim + novo.length; i++;

  h += '<div class="caixa"><button type="button" class="link" id="ccoVoltar">← minhas avaliações</button><h2 style="margin:6px 0 2px">Avaliação de ' + esc(a.avaliado) + '</h2><div class="aviso">' + esc(a.data) +
    ' · <a href="' + esc(a.pastaUrl) + '" target="_blank" rel="noopener">📁 pasta da avaliação</a></div></div>';
  h += '<div class="caixa"><h2>1 · Documentos do processo</h2><p class="aviso" style="margin-top:0">Envie tudo o que o docente mandou para a CCO: PDF, fotos ou a planilha RAD (.xlsx). Mande também o ofício de formação da CCO: ele fica guardado como comprovante para os 3 membros usarem na próxima progressão (pela varredura).</p>' +
    '<div>' + esperados.map(function(e){ var tem = docs.some(function(f){ return e[0].test(f.nome); }); return '<span class="chip"' + (tem ? '' : ' style="opacity:.7"') + '>' + (tem ? '✓ ' : '○ ') + esc(e[1]) + '</span>'; }).join('') + '</div>' +
    (docs.length ? docs.map(function(f){ return '<div class="item"><div><a href="' + esc(f.url) + '" target="_blank" rel="noopener">📄 ' + esc(f.nome) + '</a> <span class="aviso">' + f.kb + ' KB</span></div><button type="button" class="link" data-apagararq="' + esc(f.id) + '">apagar</button></div>'; }).join('') : '<p class="aviso">Nenhum documento ainda.</p>') +
    '<div class="botoes"><label class="btn sec" style="margin:0;color:var(--navy);font-size:14px">📤 Enviar documentos<input type="file" id="ccoArqs" multiple accept="application/pdf,image/*,.xlsx,.xls" class="oculto"></label></div><div id="ccoMsg" class="aviso"></div></div>';
  h += '<div class="caixa"><h2>2 · Avaliação por IA</h2><p class="aviso" style="margin-top:0">Etapa 1: a IA lê a RAD e procura o comprovante de cada linha, recalculando os pontos pelas regras da CPPD. Etapa 2 (dupla verificação): outra leitura confere o relatório da etapa 1 contra os documentos. Leva alguns minutos.</p>' +
    '<div class="botoes"><button type="button" id="btCcoAvaliar"' + (docs.length ? '' : ' disabled') + '>' + (rel ? '🔁 Avaliar de novo' : a.estado === 'etapa1' ? '▶ Continuar (2ª verificação)' : '🔎 Avaliar com IA') + '</button></div><div id="ccoAvMsg"></div>' + (rel ? htmlRelCCO(rel) : '') + '</div>';
  if(rel) h += '<div class="caixa"><h2>3 · Parecer e ata</h2><label>Parecer da CCO (pode editar)</label><textarea id="ccoParecer" rows="4">' + esc(rel.parecer || '') + '</textarea>' +
    '<div class="botoes"><button type="button" class="sec" id="btCcoParecer">Salvar parecer</button></div>' +
    '<div class="grade" style="margin-top:10px;grid-template-columns:minmax(120px,200px) auto;align-items:end"><div><label>Data da reunião</label><input id="ccoDataAta" value="' + esc(a.data) + '"></div><div><button type="button" id="btCcoAta">Gerar ata da CCO</button></div></div>' +
    a.arquivos.filter(function(f){ return f.gerado; }).map(function(f){ return '<div style="margin-top:6px"><a href="' + esc(f.url) + '" target="_blank" rel="noopener">📄 ' + esc(f.nome) + '</a></div>'; }).join('') + '<div id="ccoAtaMsg" class="aviso"></div></div>';
  $('corpo').innerHTML = h; window.scrollTo(0, 0);
  $('ccoVoltar').addEventListener('click', abrirCCO);
  $('ccoArqs').addEventListener('change', function(){
    var fs = Array.prototype.slice.call(this.files), m = $('ccoMsg'), atual = a, seq = Promise.resolve();
    fs.forEach(function(f, i){ seq = seq.then(function(){
      m.textContent = 'Enviando ' + (i + 1) + ' de ' + fs.length + ': ' + f.name + '…';
      if(f.size > 25 * 1024 * 1024) throw new Error(f.name + ': grande demais (máx. 25 MB).');
      var envio = lerArquivo(f).then(function(b64){ return api('progCCOEnviar', {id: a.id, nome: f.name, dados: b64, mime: f.type || 'application/octet-stream'}); });
      if(/\.xlsx?$/i.test(f.name)) envio = envio.then(function(){ return textoDaPlanilha(f); }).then(function(txt){
        return api('progCCOEnviar', {id: a.id, nome: f.name.replace(/\.xlsx?$/i, '') + ' (texto da planilha).txt', dados: btoa(unescape(encodeURIComponent(txt))), mime: 'text/plain'}); });
      return envio.then(function(x){ atual = x; }); }); });
    seq.then(function(){ desenharCCOAval(atual); }).catch(function(e){ m.innerHTML = '<span class="erro">' + esc(e.message) + '</span>'; });
  });
  document.querySelectorAll('[data-apagararq]').forEach(function(b){ b.addEventListener('click', function(){ if(!confirm('Apagar este arquivo da avaliação? (vai para a lixeira do Drive)')) return;
    api('progCCOApagarArquivo', {id: a.id, arquivoId: b.dataset.apagararq}).then(desenharCCOAval).catch(function(e){ alert(e.message); }); }); });
  $('btCcoAvaliar').addEventListener('click', function(){
    var m = $('ccoAvMsg'), bt = this; bt.disabled = true;
    var etapa2 = function(){ m.innerHTML = '<p class="carregando">2/2 · Dupla verificação: conferindo o relatório contra os documentos… (1 a 3 min)</p>'; return api('progCCOAvaliar', {id: a.id, etapa: 2}).then(desenharCCOAval); };
    var p = (a.estado === 'etapa1' && !rel) ? etapa2() : (function(){ m.innerHTML = '<p class="carregando">1/2 · Lendo a RAD e procurando o comprovante de cada linha… (2 a 4 min)</p>';
      return api('progCCOAvaliar', {id: a.id, etapa: 1}).then(function(r){ m.innerHTML = '<p class="ok">Etapa 1: ' + r.linhas + ' linha(s) conferida(s), ' + r.problemas + ' com observação.</p>'; a.estado = 'etapa1'; return etapa2(); }); })();
    p.catch(function(e){ m.innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; bt.disabled = false; if(a.estado === 'etapa1') bt.textContent = '▶ Continuar (2ª verificação)'; });
  });
  if($('btCcoParecer')) $('btCcoParecer').addEventListener('click', function(){ var b = this; b.disabled = true; api('progCCOParecer', {id: a.id, parecer: $('ccoParecer').value}).then(function(){ b.disabled = false; $('ccoAtaMsg').innerHTML = '<span class="ok">Parecer salvo.</span>'; }).catch(function(e){ b.disabled = false; alert(e.message); }); });
  if($('btCcoAta')) $('btCcoAta').addEventListener('click', function(){ var b = this; b.disabled = true; $('ccoAtaMsg').textContent = 'Escrevendo a ata…';
    api('progCCOParecer', {id: a.id, parecer: $('ccoParecer').value}).then(function(){ return api('progCCOAta', {id: a.id, data: $('ccoDataAta').value.trim()}); }).then(desenharCCOAval)
      .catch(function(e){ b.disabled = false; $('ccoAtaMsg').innerHTML = '<span class="erro">' + esc(e.message) + '</span>'; }); });
}
function htmlRelCCO(r){
  var h = '<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bloco)"><div style="font-size:18px;font-weight:bold">' + esc(ROT_CONC[r.conclusao] || '') + '</div><div>' + esc(r.resumo || '') + '</div>' +
    '<div class="aviso" style="margin-top:4px">' + esc([r.docente, r.siape && 'SIAPE ' + r.siape, r.periodo, r.nivelAtual && (r.nivelAtual + ' → ' + (r.nivelPretendido || '?')), r.em && 'avaliado em ' + r.em].filter(Boolean).join(' · ')) + '</div></div>';
  h += '<div class="tbox" style="margin-top:8px"><table><tr><th>Área</th><th>Declarado</th><th>Conferido</th></tr>' + (r.areas || []).map(function(x){ var dif = Math.abs((x.declarado || 0) - (x.conferido || 0)) > 0.05;
    return '<tr><td>' + esc(NOMES_AREA[x.area] || x.area) + '</td><td>' + num(x.declarado) + '</td><td' + (dif ? ' class="warn" style="font-weight:bold"' : '') + '>' + num(x.conferido) + '</td></tr>'; }).join('') +
    '<tr><th>Total</th><th>' + num(r.totalDeclarado) + '</th><th>' + num(r.totalConferido) + '</th></tr></table></div>' +
    '<p style="margin:6px 0">Nota de produtividade conferida: <b>' + esc(r.notaConferida) + '</b>' + (r.foraDocencia !== undefined ? ' · fora da docência: ' + num(r.foraDocencia) : '') +
    (r.oficioCompartilhado ? ' · <span class="ok">ofício da CCO guardado para os 3 membros</span>' : '') + '</p>';
  h += '<p style="margin:8px 0 2px"><b>Documentos</b></p>' + (r.documentos || []).map(function(d){ return '<div style="font-size:14px" class="' + (d.presente ? '' : 'warn') + '">' + (d.presente ? '✓ ' : '✗ ') + esc(d.documento) + (d.obs ? ' <span class="aviso">— ' + esc(d.obs) + '</span>' : '') + '</div>'; }).join('');
  var ls = r.linhas || [], prob = ls.filter(function(l){ return l.situacao !== 'ok'; });
  h += '<p style="margin:8px 0 2px"><b>Linhas da RAD</b> <span class="aviso">' + (ls.length - prob.length) + ' de ' + ls.length + ' ok' + (prob.length ? ', ' + prob.length + ' com observação' : '') + '</span></p>' +
    '<details' + (prob.length ? ' open' : '') + '><summary class="aviso" style="cursor:pointer">ver a tabela</summary><div class="tbox"><table><tr><th>Área</th><th>Item</th><th>Decl.</th><th>Conf.</th><th>Comprovante / observação</th></tr>' +
    ls.slice().sort(function(a, b){ return (a.situacao === 'ok') - (b.situacao === 'ok'); }).map(function(l){
      return '<tr><td>' + esc(NOMES_AREA[l.area] || l.area) + '</td><td>' + esc(l.item) + '</td><td>' + num(l.declarado) + '</td><td>' + num(l.conferido) + '</td><td class="' + SIT_COR[l.situacao] + '">' + SIT_ICO[l.situacao] + ' ' +
        esc((l.comprovante ? l.comprovante + ' · ' : '') + l.obs) + (l.revisao ? '<div class="aviso">' + esc(l.revisao) + '</div>' : '') + '</td></tr>'; }).join('') + '</table></div></details>';
  if((r.pendencias || []).length) h += '<p style="margin:8px 0 2px"><b>Pendências</b></p><ul style="margin:0;padding-left:20px">' + r.pendencias.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  var ign = (r.ignorados || []).filter(function(n){ return !/\.xlsx?$/i.test(n); });
  if(ign.length) h += '<p class="aviso">Não lidos pela IA (formato não suportado): ' + ign.map(esc).join(', ') + '.</p>';
  if(r.url) h += '<p style="margin:8px 0 0"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">📄 Relatório final no Drive</a></p>';
  return h;
}
document.querySelectorAll('.abas button[data-aba]').forEach(function(b){ b.addEventListener('click', function(){ trocarAba(b.dataset.aba); }); });
abrir();
</script>
