// Recorrige tudo com o gabarito atual; o que não couber de uma vez continua com um clique.
function recorrigirTodas(provaId, continuar){
  var msg = $('msgRecorr'), bt = $('btRecorrTodas');
  if(bt) bt.disabled = true;
  msg.innerHTML = '<p class="carregando">Corrigindo todas as entregas de novo com a IA… (pode levar alguns minutos)</p>';
  api('recorrigirTodas', {provaId: provaId, continuar: continuar}).then(function(x){
    if(x.semQuestoes){ msg.innerHTML = '<div class="erro">A prova ainda não tem questões cadastradas.</div>'; return; }
    if(x.restantes){
      msg.innerHTML = '<div class="convite">' + x.feitas + ' corrigida(s) agora; faltam ' + x.restantes + '. <button type="button" class="mini" id="btContRecorr">Continuar</button> (ou deixe: a rotina automática termina sozinha)</div>';
      $('btContRecorr').addEventListener('click', function(){ recorrigirTodas(provaId, true); });
    } else {
      abrirEntregas(provaId);
      setTimeout(function(){ var m = $('msgRecorr'); if(m) m.innerHTML = '<div class="ok">Todas as ' + x.total + ' entrega(s) foram corrigidas de novo com o gabarito atual. Revise e confirme as notas.</div>'; }, 800);
    }
  }).catch(function(e){ if(bt) bt.disabled = false; msg.innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });
}

function envioPeloProfessor(aluno, provaId){
  var box = $('envioProf');
  box.innerHTML = '<div class="detalhe"><h3>Enviar fotos por ' + esc(aluno.nome) + '</h3>' + (aluno.entrega ? '<p class="aviso">As fotos novas substituem as que já foram enviadas, e a prova é corrigida de novo.</p>' : '') +
    '<div data-sel></div><div class="botoes"><button type="button" data-ok disabled>Enviar e corrigir</button><button type="button" class="secundario" data-canc>Cancelar</button></div><div data-msg></div></div>';
  var bt = box.querySelector('[data-ok]'), msg = box.querySelector('[data-msg]');
  var sel = seletorFotos(box.querySelector('[data-sel]'), true, function(pg){ bt.disabled = !pg.length; });
  box.querySelector('[data-canc]').addEventListener('click', function(){ box.innerHTML = ''; });
  bt.addEventListener('click', function(){
    bt.disabled = true; msg.innerHTML = '<p class="carregando">Enviando…</p>';
    api('enviarProvaProfessor', {provaId: provaId, alunoId: aluno.alunoId, fotos: sel.paginas().map(function(p){ return {mime:p.mime, dados:p.dados}; })})
      .then(function(id){
        msg.innerHTML = '<p class="carregando">Fotos salvas. Corrigindo com a IA… (até 2 minutos)</p>';
        return api('corrigirEntregaProf', {entregaId: id}).then(function(){ return id; }, function(e){ msg.innerHTML = '<div class="erro">Fotos salvas, mas a correção falhou agora: ' + esc(e.message) + ' Ela fica na fila e é feita sozinha depois.</div>'; return id; });
      })
      .then(function(id){ abrirEntregas(provaId); setTimeout(function(){ abrirEntrega(id); }, 600); })
      .catch(function(e){ bt.disabled = false; msg.innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });
  });
}

// ---- ajustes da correção: confiança da leitura, salvar comentário na hora, recorrigir uma questão, vista ----
function corConf(n){ return n >= 85 ? '#1a7a3c' : n >= 60 ? '#b07d00' : '#c62828'; }
function marcarIlegivel(t){ return esc(t).replace(/\[(ilegível|ilegivel)[^\]]*\]/gi, function(m){ return '<span class="ilegivel">' + m + '</span>'; }); }
function htmlFbIA(q){
  return (q.acertos ? '<p class="fb"><b>Acertos:</b> ' + esc(q.acertos) + '</p>' : '') + (q.faltou ? '<p class="fb"><b>Faltou:</b> ' + esc(q.faltou) + '</p>' : '') + (q.melhorar ? '<p class="fb"><b>Melhorar:</b> ' + esc(q.melhorar) + '</p>' : '');
}
function htmlVistaProf(q){
  var v = q.vista; if(!v) return '';
  var ia = v.ia, nomes = {sim: 'procede', parcial: 'procede em parte', nao: 'não procede'};
  return '<div class="vistaBox"><b>Vista do aluno</b> <span class="aviso">(' + esc(v.em) + ')</span>: ' + esc(v.texto) +
    (ia ? '<div style="margin-top:8px"><b>Análise da IA:</b> ' + nomes[ia.procede] + ' · sugere <b>' + num(ia.pontos) + '</b> de ' + num(q.max) +
      (ia.leituraOk ? '' : '<br><span style="color:#9b1c1c">A leitura estava errada. Leitura correta: ' + esc(ia.transcricao) + '</span>') +
      '<br><span class="aviso">' + esc(ia.justificativa) + '</span>' +
      '<div class="botoes" style="margin-top:6px"><button type="button" class="secundario mini" data-aplicapts="' + ia.pontos + '">Usar ' + num(ia.pontos) + ' pontos</button><button type="button" class="secundario mini" data-usaresp>Usar a resposta sugerida</button></div></div>' : '') +
    '<label class="rot" style="margin-top:8px">Sua resposta à vista (o aluno vê)</label><textarea data-vistaresp data-salvo="' + esc(v.resposta) + '" data-sugestao="' + esc(ia ? ia.resposta : '') + '" style="min-height:50px">' + esc(v.resposta) + '</textarea>' +
    '<button type="button" class="secundario mini salvarCampo oculto" data-salvacampo="vista">Salvar resposta</button>' +
    (v.resposta ? '<p class="aviso" style="margin:4px 0 0">Respondida em ' + esc(v.respondidaEm) + '. Se mudar os pontos, use "Salvar" no fim da página.</p>' : '<p class="aviso" style="margin:4px 0 0">Se mudar os pontos, use "Salvar" no fim da página.</p>') + '</div>';
}
function ligarCamposProva(el, entregaId, e, soma){
  // botão "Salvar" aparece só quando o texto mudou
  var vigiar = function(ta, bt, campo, qid){
    var mostra = function(){ bt.classList.toggle('oculto', ta.value === ta.dataset.salvo); bt.textContent = campo === 'vista' ? 'Salvar resposta' : 'Salvar comentário'; };
    ta.addEventListener('input', mostra);
    bt.addEventListener('click', function(){
      bt.disabled = true;
      api('salvarCampoProva', {entregaId: entregaId, questaoId: qid || '', campo: campo, texto: ta.value}).then(function(){
        bt.disabled = false; ta.dataset.salvo = ta.value; bt.textContent = '✓ salvo'; setTimeout(mostra, 1500);
      }).catch(function(x){ bt.disabled = false; bt.textContent = 'Tentar de novo'; erroGeral(x.message); });
    });
  };
  el.querySelectorAll('[data-qid]').forEach(function(box){
    var qid = box.dataset.qid, q = e.questoes.filter(function(x){ return x.id === qid; })[0];
    vigiar(box.querySelector('[data-com]'), box.querySelector('[data-salvacampo="professor"]'), 'professor', qid);
    var ligarVista = function(){
      var vr = box.querySelector('[data-vistaresp]'); if(!vr) return;
      vigiar(vr, box.querySelector('[data-salvacampo="vista"]'), 'vista', qid);
      var ap = box.querySelector('[data-aplicapts]');
      if(ap) ap.addEventListener('click', function(){ box.querySelector('[data-pts]').value = ap.dataset.aplicapts; soma(); ap.textContent = '✓ aplicado (falta salvar no fim)'; });
      var ur = box.querySelector('[data-usaresp]');
      if(ur) ur.addEventListener('click', function(){ vr.value = vr.dataset.sugestao; vr.dispatchEvent(new Event('input')); });
    };
    ligarVista();
    box._redesenharVista = function(){ box.querySelector('[data-vistabox]').innerHTML = htmlVistaProf(q); ligarVista(); };
    // arrumar a leitura e recorrigir só esta questão
    box.querySelector('[data-recorr]').addEventListener('click', function(){
      var b = this, msg = box.querySelector('[data-recmsg]');
      b.disabled = true; msg.innerHTML = '<p class="carregando">Corrigindo esta questão… (uns 10 segundos)</p>';
      api('recorrigirQuestaoProva', {entregaId: entregaId, questaoId: qid, transcricao: box.querySelector('[data-transc]').value}).then(function(r){
        b.disabled = false;
        Object.assign(q, r.questao, {confianca: 100, duvidas: '', transcricaoEditada: true});
        box.querySelector('[data-pts]').value = r.questao.pontos; soma();
        box.querySelector('[data-fbia]').innerHTML = htmlFbIA(q);
        msg.innerHTML = '<div class="ok">Recorrigida: ' + num(r.questao.pontos) + ' de ' + num(q.max) + ' (já salva).</div>';
      }).catch(function(x){ b.disabled = false; msg.innerHTML = '<div class="erro">' + esc(x.message) + '</div>'; });
    });
  });
  vigiar($('eGeral'), $('eGeralSalvar'), 'geral', '');
  var bv = $('eVistaIA');
  if(bv) bv.addEventListener('click', function(){
    bv.disabled = true; $('eVistaMsg').innerHTML = '<p class="carregando">A IA está olhando as fotos e as explicações… (até 1 minuto)</p>';
    api('analisarVistaProva', {entregaId: entregaId}).then(function(ias){
      bv.disabled = false; $('eVistaMsg').innerHTML = '<div class="ok">Análise pronta: veja embaixo de cada questão contestada. Nada muda na nota até você aplicar e salvar.</div>';
      el.querySelectorAll('[data-qid]').forEach(function(box){
        var q = e.questoes.filter(function(x){ return x.id === box.dataset.qid; })[0];
        if(q.vista && ias[q.id]){ q.vista.ia = ias[q.id]; box._redesenharVista(); }
      });
    }).catch(function(x){ bv.disabled = false; $('eVistaMsg').innerHTML = '<div class="erro">' + esc(x.message) + '</div>'; });
  });
}

var NOMES_RIGOR_TELA = ['', 'Bem flexível', 'Flexível', 'Padrão', 'Rigoroso', 'Muito rigoroso'];
// Testes de rigor guardados: nota atual × nota simulada, questão por questão, e o que mudou
function htmlSimulacoes(sims){
  var l = Object.keys(sims || {}).map(function(k){ return sims[k]; }).sort(function(a, b){ return a.rigor - b.rigor; });
  if(!l.length) return '';
  return l.map(function(s){
    var dif = s.base === null || s.base === undefined ? null : Math.round((s.nota - s.base) * 10) / 10;
    var qs = Object.keys(s.questoes || {}).map(function(id){ return s.questoes[id]; });
    return '<div class="detalhe" style="margin-top:10px"><p style="margin:0 0 6px;font-size:15px"><b>' + esc(s.nome) + ':</b> nota <span class="nota n' + classe10(s.nota) + '">' + nota10(s.nota) + '</span>' +
        (dif !== null ? ' <span class="aviso">(atual, ' + esc(s.baseRigor) + ': ' + nota10(s.base) + ' · ' + (dif > 0 ? '+' : '') + String(dif).replace('.', ',') + ')</span>' : '') + ' <span class="aviso">· teste de ' + esc(s.em) + '</span></p>' +
      (s.resumo ? '<p class="fb" style="margin:0 0 8px"><b>O que mudou:</b> ' + esc(s.resumo) + '</p>' : '') +
      '<div class="tabelaBox"><table><thead><tr><th>Questão</th><th>Atual</th><th>' + esc(s.nome) + '</th><th>O que foi diferente</th></tr></thead><tbody>' +
        qs.map(function(q){
          var d = Math.round((q.pontos - q.atual) * 100) / 100;
          return '<tr><td>' + esc(q.rotulo) + ' <span class="aviso">(vale ' + num(q.max) + ')</span></td><td>' + num(q.atual) + '</td><td><b' + (d > 0 ? ' style="color:#1a7a3c"' : d < 0 ? ' style="color:#c62828"' : '') + '>' + num(q.pontos) + '</b></td><td style="font-size:12.5px">' + esc(q.mudou) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
  }).join('');
}
function abrirEntrega(entregaId){
  var el = $('areaEntrega');
  el.innerHTML = '<div class="caixa"><p class="carregando">Carregando a prova e as fotos…</p></div>';
  api('verEntrega', {entregaId: entregaId}).then(function(e){
    var h = '<div class="caixa"><h2>' + esc(e.alunoNome) + ' · ' + esc(e.prova.titulo) + '</h2>' +
      '<p class="aviso">Enviada em ' + esc(e.enviadaEm) + '' + ' · ' + tagEntrega(e, 'fechada') + ' · <span id="eEnvio">' + tagEnvio(e, e.prova.resultadosLiberados) + '</span>' + (e.visto && e.visto.vezes ? ' · 👁 o aluno abriu ' + e.visto.vezes + '× (' + tempoTxt(e.visto.seg) + '; 1ª vez ' + esc(e.visto.primeiro) + ', última ' + esc(e.visto.ultimo) + ')' : e.status === 'corrigida' && e.prova.resultadosLiberados ? ' · o aluno ainda não abriu a correção' : '') + (e.erro && e.erro !== 'cota' ? ' · erro: ' + esc(e.erro) : '') + '</p>';
    if(e.revisaoPedida) h += '<div class="convite"><b>O aluno pediu revisão:</b> ' + esc(e.revisaoPedida) + '</div>';
    h += '<details open><summary class="link">Fotos (' + e.fotos.length + ')</summary><div class="fotosGrandes">' + e.fotos.map(function(f, i){
      return f.mime === 'application/pdf' ? '<a class="link" download="prova.pdf" href="data:application/pdf;base64,' + f.dados + '">Abrir PDF ' + (i + 1) + '</a>' : '<img src="data:' + f.mime + ';base64,' + f.dados + '" alt="Página ' + (i + 1) + '">';
    }).join('') + '</div></details>';
    if(!e.geral.legivel) h += '<div class="erro">A IA marcou as fotos como ilegíveis: ' + esc(e.geral.comentario) + '</div>';
    // confiança da leitura (vem na mesma correção da IA)
    var comConf = e.questoes.filter(function(q){ return q.confianca !== null && q.confianca !== undefined; });
    if(comConf.length){
      var media = Math.round(comConf.reduce(function(t, q){ return t + q.confianca; }, 0) / comConf.length);
      var pior = comConf.slice().sort(function(a, b){ return a.confianca - b.confianca; })[0];
      h += '<p class="aviso" style="margin:8px 0 0">Confiança da leitura da IA: <b style="color:' + corConf(media) + '">' + media + '%</b>' + (pior.confianca < 80 ? ' · mais baixa: questão ' + esc(pior.rotulo || pior.ordem) + ' (' + pior.confianca + '%)' : '') + '. Abra "O que a IA leu" para conferir e arrumar.</p>';
    }
    var nVista = e.questoes.filter(function(q){ return q.vista; }).length;
    var jaAnalisou = e.questoes.some(function(q){ return q.vista && q.vista.ia; });
    if(nVista) h += '<div class="convite"><b>Vista de prova:</b> o aluno contestou ' + nVista + ' questão(ões) (veja embaixo de cada uma). ' +
      (jaAnalisou ? 'A IA já analisou e deixou a sugestão em cada uma.' : e.vistaNaFila ? '<b>A IA está analisando</b> (leva cerca de 1 minuto depois do envio; recarregue para ver).' : 'A análise automática ainda não rodou.') +
      ' <button type="button" class="' + (jaAnalisou ? 'secundario ' : '') + 'mini" id="eVistaIA">' + (jaAnalisou ? 'Analisar de novo' : 'Analisar agora') + '</button> <span class="aviso">1 chamada para a prova inteira, olhando as fotos</span><div id="eVistaMsg"></div></div>';
    h += '<h4>Correção <span class="aviso" id="eNota"></span></h4>' + e.questoes.map(function(q){
      return '<div class="questao" data-qid="' + esc(q.id) + '" data-max="' + q.max + '"><div class="cab"><span>Questão ' + esc(q.rotulo || q.ordem) + (q.assunto ? ' · <span style="font-weight:normal">' + esc(q.assunto) + '</span>' : '') + '</span><span class="aviso">vale ' + num(q.max) + '</span></div>' +
        '<p class="aviso" style="margin:4px 0 8px">' + esc(q.enunciado) + '</p>' +
        '<details><summary class="link" style="font-size:13px">O que a IA leu' + (q.confianca !== null && q.confianca !== undefined ? ' · <b style="color:' + corConf(q.confianca) + '">' + q.confianca + '% de confiança</b>' : '') + (q.transcricaoEditada ? ' · <span class="tag t-azul">leitura arrumada por você</span>' : '') + '</summary>' +
          '<p style="white-space:pre-line;font-size:14px;margin-top:6px">' + (marcarIlegivel(q.transcricao) || '<i>nada</i>') + '</p>' +
          (q.duvidas ? '<p class="fb" style="color:#9b1c1c"><b>Trechos com dúvida:</b> ' + esc(q.duvidas) + '</p>' : '') +
          '<label class="rot" style="margin-top:8px">Arrumar a leitura (escreva o que o aluno escreveu de fato)</label><textarea data-transc style="min-height:60px">' + esc(q.transcricao) + '</textarea>' +
          '<div class="botoes" style="margin-top:6px"><button type="button" class="secundario mini" data-recorr>Corrigir esta questão de novo com esta leitura</button><span class="aviso">1 chamada leve da IA, só texto</span></div><div data-recmsg></div></details>' +
        '<div data-fbia>' + htmlFbIA(q) + '</div>' +
        '<div class="campos" style="margin:10px 0 0"><div><label class="rot">Pontos</label><input type="number" min="0" max="' + q.max + '" step="0.25" data-pts value="' + (q.pontos === null ? '' : q.pontos) + '"></div>' +
        '<div class="campoLargo"><label class="rot">Seu comentário para o aluno (opcional)</label><textarea data-com data-salvo="' + esc(q.professor) + '" style="min-height:50px">' + esc(q.professor) + '</textarea>' +
          '<button type="button" class="secundario mini salvarCampo oculto" data-salvacampo="professor">Salvar comentário</button></div></div>' +
        '<div data-vistabox>' + htmlVistaProf(q) + '</div></div>';
    }).join('');
    // teste de rigor: só para comparar, a nota oficial não muda
    if(e.status === 'corrigida') h += '<details class="convite" style="margin-top:12px"' + (Object.keys(e.simulacoes || {}).length ? ' open' : '') + '><summary style="cursor:pointer;font-weight:bold">🧪 Testar outro rigor <span class="aviso" style="font-weight:normal">(não muda a nota nem a correção)</span></summary>' +
      '<p class="aviso" style="margin:6px 0">Corrige de novo com outro rigor, só para comparar. Usa a mesma leitura da folha que a IA já fez (1 chamada, só texto). A nota e a correção atuais continuam valendo. Rigor desta prova: <b>' + esc(NOMES_RIGOR_TELA[Number(e.prova.rigor) || 3]) + '</b>.</p>' +
      '<div class="rigorBarra">' + [1, 2, 3, 4, 5].map(function(n){ return '<button type="button" data-simrig="' + n + '"' + (n === (Number(e.prova.rigor) || 3) ? ' disabled title="é o rigor atual desta prova"' : '') + '>' + NOMES_RIGOR_TELA[n] + '</button>'; }).join('') + '</div>' +
      '<div id="simMsg"></div><div id="simRes">' + htmlSimulacoes(e.simulacoes) + '</div></details>';
    h += '<div class="detalhe"><p class="fb" style="margin-top:0"><b>Visão geral da IA:</b> ' + esc(e.geral.comentario) + '</p>' + (e.geral.fortes ? '<p class="fb"><b>Pontos fortes:</b> ' + esc(e.geral.fortes) + '</p>' : '') + (e.geral.estudar ? '<p class="fb"><b>O que estudar:</b> ' + esc(e.geral.estudar) + '</p>' : '') + '</div>' +
      '<label class="rot" style="margin-top:12px" for="eGeral">Seu comentário geral para o aluno (opcional)</label><textarea id="eGeral" data-salvo="' + esc(e.geral.professor) + '">' + esc(e.geral.professor) + '</textarea>' +
      '<button type="button" class="secundario mini salvarCampo oculto" id="eGeralSalvar">Salvar comentário</button>' +
      // nomes conforme a situação: com os resultados ocultos, o aluno ainda não vê a nota provisória
      '<div class="botoes" style="align-items:center"><button type="button" id="eConf">' + (e.prova.resultadosLiberados ? 'Liberar nota definitiva' : 'Salvar nota definitiva') + '</button>' +
        '<details class="ajuda"><summary aria-label="O que é isto?">?</summary><div>A <b>nota definitiva</b> é a nota já revisada por você. O aluno passa a ver <b>"nota definitiva"</b>' + (e.prova.resultadosLiberados ? '' : ' (quando você usar "Liberar correção para a turma" na lista)') + ' e recebe um e-mail e um aviso no celular. Se precisar, você ainda pode mudar depois e salvar de novo (ele recebe um novo aviso).</div></details>' +
        '<button type="button" class="secundario" id="eSalvar">' + (e.prova.resultadosLiberados ? 'Liberar nota provisória' : 'Salvar nota provisória') + '</button>' +
        '<details class="ajuda"><summary aria-label="O que é isto?">?</summary><div>' + (e.prova.resultadosLiberados
          ? 'Grava os seus ajustes e o aluno já vê a nota nova como <b>"nota provisória"</b>, sem e-mail nem aviso. Use enquanto ainda revisa (por exemplo, esperando as vistas de prova). Quando terminar, use "Liberar nota definitiva".'
          : 'Grava os seus ajustes sem fechar a nota. A correção desta prova ainda está <b>oculta</b> para a turma: o aluno só vê a nota quando você usar "Liberar correção para a turma" na lista, e aí ela aparece como <b>"nota provisória"</b> até você salvar a nota definitiva.') + '</div></details>' +
        '<button type="button" class="secundario" id="eRecorr">Corrigir de novo com IA</button>' +
        (e.confirmada ? '<button type="button" class="secundario" id="eDesfazer">↩ Voltar para nota provisória</button>' : '') + '</div>' +
      '<div id="eMsg"></div></div>';
    el.innerHTML = h;
    el.querySelectorAll('.fotosGrandes img').forEach(function(img){ img.addEventListener('click', function(){ ampliar(img.src); }); });
    el.querySelectorAll('[data-simrig]').forEach(function(b){ b.addEventListener('click', function(){
      var n = Number(b.dataset.simrig);
      el.querySelectorAll('[data-simrig]').forEach(function(x){ x.disabled = true; });
      $('simMsg').innerHTML = '<p class="carregando">Corrigindo de novo como "' + esc(NOMES_RIGOR_TELA[n]) + '"… (uns 30 segundos)</p>';
      api('simularRigor', {entregaId: entregaId, rigor: n}).then(function(s){
        e.simulacoes = e.simulacoes || {}; e.simulacoes[n] = s;
        $('simMsg').innerHTML = ''; $('simRes').innerHTML = htmlSimulacoes(e.simulacoes);
      }).catch(function(x){ $('simMsg').innerHTML = '<div class="erro">' + esc(x.message) + '</div>'; })
        .then(function(){ el.querySelectorAll('[data-simrig]').forEach(function(x){ x.disabled = Number(x.dataset.simrig) === (Number(e.prova.rigor) || 3); }); });
    }); });
    function soma(){
      var t = 0, m = 0;
      el.querySelectorAll('[data-qid]').forEach(function(box){ m += Number(box.dataset.max); t += Number(String(box.querySelector('[data-pts]').value).replace(',', '.')) || 0; });
      $('eNota').textContent = '· ' + num(t) + ' de ' + num(m) + ' pontos = nota ' + nota10(m ? Math.round(t / m * 100) / 10 : 0);
    }
    el.querySelectorAll('[data-pts]').forEach(function(i){ i.addEventListener('input', soma); }); soma();
    ligarCamposProva(el, entregaId, e, soma);
    function salvar(confirmar, bt){
      bt.disabled = true;
      var qs = Array.prototype.map.call(el.querySelectorAll('[data-qid]'), function(box){
        return {id: box.dataset.qid, pontos: String(box.querySelector('[data-pts]').value).replace(',', '.'), professor: box.querySelector('[data-com]').value};
      });
      api('revisarEntrega', {entregaId: entregaId, questoes: qs, comentario: $('eGeral').value, confirmar: confirmar}).then(function(r){
        bt.disabled = false;
        e.status = 'corrigida'; e.confirmada = !!r.confirmada; e.confirmadaEm = r.confirmadaEm || '';
        if($('eEnvio')) $('eEnvio').innerHTML = tagEnvio(e, e.prova.resultadosLiberados);
        atualizarTopoProvas();
        $('eMsg').innerHTML = '<div class="ok">Salvo. Nota final: ' + nota10(r.notaFinal) + (r.confirmada ? ' (definitiva' + (e.prova.resultadosLiberados ? '; o aluno foi avisado por e-mail e no celular).' : '; o aluno vê quando você liberar a correção para a turma).') : e.prova.resultadosLiberados ? ' (provisória; o aluno já vê).' : ' (provisória; a correção ainda está oculta para a turma).') + ' Clique em Atualizar na lista para ver a tabela nova.</div>';
      }).catch(function(x){ bt.disabled = false; $('eMsg').innerHTML = '<div class="erro">' + esc(x.message) + '</div>'; });
    }
    $('eConf').addEventListener('click', function(){ salvar(true, this); });
    $('eSalvar').addEventListener('click', function(){ salvar(false, this); });
    var bd = $('eDesfazer');
    if(bd) bd.addEventListener('click', function(){
      if(!window.confirm('Voltar a nota de ' + e.alunoNome + ' para PROVISÓRIA? Os pontos e comentários ficam como estão. O aluno não recebe aviso; se ainda estiver no prazo, ele volta a poder pedir vista.')) return;
      bd.disabled = true;
      api('voltarParaProvisoria', {entregaId: entregaId}).then(function(){ abrirEntrega(entregaId); atualizarTopoProvas(); })
        .catch(function(x){ bd.disabled = false; $('eMsg').innerHTML = '<div class="erro">' + esc(x.message) + '</div>'; });
    });
    $('eRecorr').addEventListener('click', function(){
      var b = this;
      if(b.dataset.conf !== '1'){ b.dataset.conf = '1'; b.textContent = 'Confirmar: refazer a correção (apaga os ajustes)'; return; }
      b.disabled = true; $('eMsg').innerHTML = '<p class="carregando">Corrigindo com a IA… (até 2 minutos)</p>';
      api('corrigirEntregaProf', {entregaId: entregaId}).then(function(){ abrirEntrega(entregaId); })
        .catch(function(x){ b.disabled = false; $('eMsg').innerHTML = '<div class="erro">' + esc(x.message) + '</div>'; });
    });
    el.scrollIntoView({behavior:'smooth', block:'start'});
  }).catch(function(x){ el.innerHTML = '<div class="caixa"><p class="erro">' + esc(x.message) + '</p></div>'; });
}

/* ================= CHAT COM IA =================
   Conversa do professor com a IA sobre a plataforma e os próprios dados.
   A memória (últimas 10 mensagens) fica neste navegador até fechar a aba. */
var CHAT = {hist: [], enviando: false};
try{ CHAT.hist = JSON.parse(sessionStorage.getItem('chat_ia') || '[]'); }catch(e){ CHAT.hist = []; }
function guardarChat(){ try{ sessionStorage.setItem('chat_ia', JSON.stringify(CHAT.hist.slice(-30))); }catch(e){} }
function mdChat(t){
  var h = esc(t);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return h.split('\n').map(function(l){
    if(/^\s*#{1,4}\s+/.test(l)) return '<b>' + l.replace(/^\s*#{1,4}\s+/, '') + '</b>';
    if(/^\s*[-*]\s+/.test(l)) return '&nbsp;&nbsp;• ' + l.replace(/^\s*[-*]\s+/, '');
    return l;
  }).join('<br>');
}
function abrirChat(el){
  if(!el) return;
  if(!el.dataset.montado){
    el.dataset.montado = '1';
    el.innerHTML = '<div class="caixa"><div class="chatCab"><span class="robo" aria-hidden="true">🤖</span><div><h2>Chat com IA</h2>' +
      '<p class="aviso" style="margin:0">Pergunte sobre o uso da plataforma, suas disciplinas, notas, alunos, aulas e provas. Ele só consulta: para mudar algo, ele diz onde fazer. <b>Só responde sobre as suas próprias disciplinas.</b></p></div></div>' +
      '<div class="convite" style="margin:0"><b>Use com moderação.</b> Cada mensagem consome a cota do Gemini das suas chaves — a mesma usada para transcrever as aulas, gerar questões e corrigir respostas. Em dia de aula, prefira perguntas objetivas.</div>' +
      '<div class="chatMsgs" id="chatMsgs" aria-live="polite"></div>' +
      '<div class="chips" id="chatSug" style="margin-bottom:8px"></div>' +
      '<div class="chatEntrada"><textarea id="chatTexto" placeholder="Escreva sua pergunta… (Enter envia, Shift+Enter pula linha)"></textarea><button type="button" id="chatEnviar">Enviar</button></div>' +
      '<div class="chatRodape"><span class="usoIA" id="chatUso">Carregando o uso de hoje…</span><button type="button" class="link" id="chatLimpar" style="font-size:12.5px">Nova conversa</button></div></div>';
    var sug = ['Quais alunos estão com a menor média?', 'Resuma o desempenho da turma na última aula', 'Quem está abaixo da presença mínima?', 'Como faço para liberar questões?'];
    $('chatSug').innerHTML = sug.map(function(s){ return '<button type="button" class="chip" data-sug="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
    $('chatSug').querySelectorAll('[data-sug]').forEach(function(b){ b.addEventListener('click', function(){ enviarChat(b.dataset.sug); }); });
    $('chatEnviar').addEventListener('click', function(){ enviarChat($('chatTexto').value); });
    $('chatTexto').addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviarChat($('chatTexto').value); } });
    $('chatLimpar').addEventListener('click', function(){ CHAT.hist = []; guardarChat(); desenharChat(); });
  }
  desenharChat();
  api('usoIA').then(mostrarUsoIA).catch(function(){ var u = $('chatUso'); if(u) u.textContent = ''; });
}
function desenharChat(){
  var box = $('chatMsgs'); if(!box) return;
  box.innerHTML = CHAT.hist.length ? CHAT.hist.map(function(m){
    return '<div class="msg ' + (m.papel === 'ia' ? 'ia' : 'eu') + '">' + (m.papel === 'ia' ? mdChat(m.texto) : esc(m.texto).replace(/\n/g, '<br>')) + '</div>';
  }).join('') + (CHAT.enviando ? '<div class="msg ia pensando">Pensando…</div>' : '')
    : '<p class="aviso" style="margin:auto;text-align:center">Faça uma pergunta ou toque numa sugestão abaixo.</p>';
  $('chatSug').classList.toggle('oculto', CHAT.hist.length > 0);
  box.scrollTop = box.scrollHeight;
}
function mostrarUsoIA(u){
  var el = $('chatUso'); if(!el || !u) return;
  el.textContent = 'Uso da IA hoje nas suas chaves: ' + u.chamadas + ' chamada(s) · ' + (u.tokens >= 1000 ? Math.round(u.tokens / 1000) + ' mil' : u.tokens) + ' tokens · ' + u.chaves + ' chave(s). ' +
    'A cota grátis zera entre 4h e 5h (Brasília); o Google não informa quanto resta.';
}
function enviarChat(texto){
  texto = String(texto || '').trim();
  if(!texto || CHAT.enviando) return;
  CHAT.hist.push({papel: 'eu', texto: texto.slice(0, 2000)});
  CHAT.enviando = true; $('chatTexto').value = ''; $('chatEnviar').disabled = true;
  guardarChat(); desenharChat();
  api('chatIA', {mensagens: CHAT.hist.slice(-10)}).then(function(r){
    CHAT.hist.push({papel: 'ia', texto: r.resposta});
    mostrarUsoIA(r.uso);
  }).catch(function(e){
    CHAT.hist.push({papel: 'ia', texto: '⚠ ' + e.message});
  }).then(function(){
    CHAT.enviando = false; $('chatEnviar').disabled = false; guardarChat(); desenharChat(); $('chatTexto').focus();
  });
}

// bolinhas "?": abre uma por vez, fecha ao clicar fora e não deixa a caixinha sair da tela
document.addEventListener('click', function(ev){
  document.querySelectorAll('details.ajuda[open]').forEach(function(d){ if(!d.contains(ev.target)) d.removeAttribute('open'); });
});
document.addEventListener('toggle', function(ev){
  var d = ev.target; if(!d || !d.matches || !d.matches('details.ajuda') || !d.open) return;
  var cx = d.querySelector(':scope > div'); if(!cx) return;
  cx.style.left = '-10px';
  var r = cx.getBoundingClientRect(), sobra = r.right - (window.innerWidth - 8);
  if(sobra > 0) cx.style.left = (-10 - sobra) + 'px';
}, true);
</script>
