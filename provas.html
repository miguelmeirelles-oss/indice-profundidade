<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova por IA — Engenharia de Alimentos</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --menu:#17389C; --azul:#2E62C6; --titulo:#3E76C4; --navy:#0E2A5C;
    --bloco:#EFF1F5; --ambar:#F5C518; --branco:#fff; --cinza:#5b6b86;
    --verde:#1a7a3c; --vermelho:#8a1c1c; --ocre:#8a6100; --linha:#d7deea;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:Arial,Helvetica,sans-serif;color:var(--navy);background:var(--branco);font-size:15px;line-height:1.45}
  .wrap{max-width:960px;margin:0 auto}
  .oculto{display:none!important}
  details.ajuda{display:inline-block;vertical-align:middle;margin-left:4px}
  details.ajuda>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--menu);color:#fff;font-size:12px;font-weight:bold;line-height:1}
  details.ajuda>summary::-webkit-details-marker{display:none}
  details.ajuda[open]{display:block;margin:6px 0}
  details.ajuda>div{font-family:Arial,Helvetica,sans-serif;margin-top:6px;background:#f5f8fe;border-left:4px solid var(--menu);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;line-height:1.55;font-weight:normal;color:var(--navy);text-transform:none;letter-spacing:0}
  .rigorBarra{display:flex;gap:6px;flex-wrap:wrap}
  .rigorBarra button{background:#fff;box-shadow:none;border:2px solid var(--linha);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--navy)}
  .rigorBarra button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rigorBarra button:hover{transform:none;box-shadow:none}
  .cabecalho{background:var(--menu);border:2.5px solid var(--navy);border-radius:18px;box-shadow:4px 5px 0 var(--navy);padding:22px 24px;margin-bottom:18px;color:#fff}
  .cabecalho h1{margin:0;font-size:28px;line-height:1.15;color:#fff}
  .cabecalho p{margin:6px 0 0;font-size:14px;color:#cddaf5;max-width:560px}
  .topoFlex{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
  .quem{font-size:13px;color:#cddaf5;text-align:right}
  .quem b{color:#fff;display:block;font-size:14px}
  .quem a{color:#cddaf5}
  .visao{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .barraVisao{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .barraVisao .visao{margin-top:0}
  .btMsg{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--menu);border:1.5px solid var(--menu);border-radius:4px;padding:7px 15px;font-size:13.5px;font-weight:bold;text-decoration:none}
  .visao button{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.45);box-shadow:none;border-radius:999px;padding:7px 15px;font-size:13px}
  .visao button[aria-pressed="true"]{background:var(--ambar);color:var(--navy);border-color:var(--navy);box-shadow:3px 4px 0 rgba(0,0,0,.35)}
  .visao button:hover{transform:none}
  .caixa{border:2.5px solid var(--navy);border-radius:18px;background:#fff;box-shadow:4px 5px 0 var(--navy);padding:18px;margin-bottom:18px}
  h2{font-size:15px;color:var(--menu);margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em}
  h3{font-size:16px;margin:0 0 6px}
  h4{font-size:15px;margin:14px 0 6px;color:var(--menu)}
  p{margin:0 0 10px}
  .aviso{font-size:12.5px;color:var(--cinza)}
  button{font-family:inherit;font-size:14.5px;font-weight:bold;cursor:pointer;border:2.5px solid var(--navy);border-radius:14px;padding:10px 18px;background:var(--ambar);color:var(--navy);box-shadow:3px 4px 0 var(--navy)}
  button:hover{transform:translate(1px,1px);box-shadow:2px 3px 0 var(--navy)}
  button:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--navy)}
  button:disabled{opacity:.5;cursor:default;transform:none;box-shadow:3px 4px 0 var(--navy)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,label.arquivo:focus-within{outline:3px solid var(--ambar);outline-offset:2px}
  button.secundario{background:#fff}
  button.mini{padding:5px 11px;font-size:12.5px;border-radius:10px;box-shadow:2px 2px 0 var(--navy)}
  .link{background:none;border:none;box-shadow:none;color:var(--azul);font-size:14px;font-weight:bold;text-decoration:underline;padding:4px 0}
  .link:hover{transform:none;box-shadow:none}
  .botoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  label.rot{display:block;font-size:12px;font-weight:bold;color:var(--titulo);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:10px 12px;font-family:inherit;font-size:14.5px;color:var(--navy);border:2px solid var(--azul);border-radius:12px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
  .campoLargo{grid-column:1/-1}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--azul);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:bold;color:var(--azul);background:#fff;box-shadow:none}
  .chip:hover{background:var(--bloco);transform:none;box-shadow:none}
  .chip[aria-pressed="true"]{background:var(--azul);color:#fff}
  .tag{display:inline-block;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;border-radius:99px;padding:2px 9px;border:1.5px solid currentColor;white-space:nowrap}
  .t-ok{color:var(--verde)} .t-warn{color:var(--ocre)} .t-err{color:#c62828} .t-azul{color:var(--azul)} .t-cinza{color:var(--cinza)}
  .badge{display:inline-block;min-width:18px;height:18px;border-radius:99px;background:#e23b3b;color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:6px;padding:0 5px}
  .linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap}
  .linha:last-child{border-bottom:none}
  .convite{background:var(--bloco);border-left:8px solid var(--ambar);border-radius:0 14px 14px 0;padding:12px 16px;margin:0 0 14px}
  .erro{background:#fdecec;border:2px solid #e23b3b;border-radius:12px;padding:10px 14px;color:var(--vermelho);font-size:14px;margin:12px 0}
  .ok{background:#e6f4ea;border:2px solid var(--verde);border-radius:12px;padding:10px 14px;color:var(--verde);font-size:14px;margin:12px 0}
  .carregando{color:var(--cinza);font-size:14px;padding:8px 0}
  .grande{font-size:44px;font-weight:bold;color:var(--menu);line-height:1;font-variant-numeric:tabular-nums}
  .contagem{font-variant-numeric:tabular-nums;font-weight:bold;color:#c62828}
  .cfg{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px;margin-top:8px}
  .cfg span:nth-child(odd){color:var(--cinza)}
  .cfg span:nth-child(even){font-weight:bold;text-align:right}
  .nota{display:inline-block;min-width:44px;text-align:center;font-weight:bold;font-size:13px;border:2px solid var(--navy);border-radius:99px;padding:2px 8px;font-variant-numeric:tabular-nums}
  .n0{background:#fdecec;color:#8a1c1c} .n1{background:#fff4d6;color:#8a6100} .n2{background:#e6f4ea;color:#1a7a3c}
  .detalhe{background:var(--bloco);border:2px solid var(--navy);border-radius:14px;padding:12px 14px;margin-top:10px}
  .questao{border:2px solid var(--linha);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .questao .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-weight:bold}
  .fb{font-size:14px;margin:6px 0 0}
  .ilegivel{background:#fde2e2;color:#9b1c1c;border-radius:3px;padding:0 3px}
  .vistaBox{border-left:4px solid #b07d00;background:#fff8e6;padding:8px 12px;margin-top:10px;border-radius:6px;font-size:14px}
  .salvarCampo{margin-top:6px}
  .fb b{color:var(--menu)}
  .miniaturas{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .miniaturas figure{margin:0;position:relative;width:110px}
  .miniaturas img{width:110px;height:140px;object-fit:cover;border:2px solid var(--navy);border-radius:10px;display:block;cursor:zoom-in;background:var(--bloco)}
  .miniaturas figcaption{font-size:11.5px;color:var(--cinza);text-align:center}
  .miniaturas .tirar{position:absolute;top:-8px;right:-8px;padding:0 7px;border-radius:99px;font-size:13px;box-shadow:none}
  .pdf{width:110px;height:140px;border:2px dashed var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:bold}
  label.arquivo{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:bold;font-size:14.5px;border:2.5px solid var(--navy);border-radius:14px;padding:10px 18px;background:#fff;box-shadow:3px 4px 0 var(--navy)}
  label.arquivo input{position:absolute;opacity:0;width:1px;height:1px}
  .fotosGrandes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
  .fotosGrandes img{width:100%;border:2px solid var(--navy);border-radius:10px;cursor:zoom-in;display:block}
  .tabelaBox{overflow-x:auto;border:2px solid var(--linha);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px;border-bottom:1px solid var(--linha);text-align:left;white-space:nowrap}
  th{background:var(--bloco);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza)}
  .qEdit{border:2px solid var(--linha);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#fbfcfe}
  .folhaTela{background:#e9edf4;padding:16px;border-radius:12px;overflow-x:auto;margin-top:10px}
  .folhaTela .folha{max-width:800px;margin:0 auto;padding:34px 44px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
  .ajQ{font-family:inherit;background:var(--bloco);border:2px dashed var(--linha);border-radius:10px;padding:8px 10px;margin:-6px 0 24px}
  .ajQ label,.ajQ textarea,.ajQ button{font-family:Arial,Helvetica,sans-serif}
  .figsEdit{display:flex;flex-direction:column;gap:10px;margin:8px 0 10px}
  .figEdit{border:1px solid var(--linha);border-radius:10px;padding:8px;background:#fff;text-align:center}
  .figEdit svg{max-width:100%;height:auto}
  @media (max-width:700px){ .folhaTela{padding:6px} .folhaTela .folha{padding:18px 14px} .folha .fNome{overflow-wrap:anywhere} }
  .sugIA{display:inline-block;color:#fff;background:#c62828;font-size:11.5px;font-weight:bold;border-radius:6px;padding:2px 8px;margin:0 0 6px;letter-spacing:.02em}
  .comSug{border-color:#c62828!important;background:#fff6f6!important}
  .qrTela,.zoom{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
  .zoom{background:rgba(14,42,92,.92);cursor:zoom-out}
  .zoom img{max-width:100%;max-height:100%;border-radius:8px}
  .qrCaixa{text-align:center;max-width:900px}
  .qrCaixa h2{font-size:clamp(20px,3.2vw,36px);text-transform:none;letter-spacing:0;margin-bottom:16px}
  .qrDesenho{display:inline-block;padding:16px;border:3px solid var(--navy);border-radius:18px;background:#fff}
  .qrDesenho img,.qrDesenho canvas{display:block}
  .qrUrl{font-family:Consolas,monospace;font-size:clamp(13px,1.6vw,20px);word-break:break-all;margin:16px 0 6px}
  .qrInstr{font-size:clamp(15px,2vw,24px);color:var(--cinza)}
  @media (max-width:520px){body{padding:12px}.cabecalho h1{font-size:23px}.quem{text-align:left}}

  /* ===== Identidade visual engalimentos — só aparência; apagar este bloco volta ao visual anterior ===== */
  :root{--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;--tinta-fraca:#4A5C74;--sombra:4px 5px 0 rgba(14,42,92,.13);--linha:#D7DEE8}
  body{font-size:14.5px;line-height:1.55}
  /* cabeçalho: faixa clara com filete azul, título fino */
  .cabecalho{background:var(--bloco);color:var(--navy);border:0;border-top:4px solid var(--menu);border-radius:0;box-shadow:none;padding:20px 24px}
  .cabecalho h1{color:var(--titulo);font-weight:400;font-size:31px;letter-spacing:-.01em;line-height:1.2}
  .cabecalho p{color:var(--tinta-fraca);font-size:14.5px}
  .cabecalho .quem{color:var(--tinta-fraca)}
  .cabecalho .quem b{color:var(--navy)}
  .cabecalho .quem a{color:var(--azul)}
  .visao button{background:#fff;color:#41546C;border:1.5px solid var(--linha);border-radius:4px;box-shadow:none;font-weight:normal}
  .visao button[aria-pressed="true"]{background:var(--menu);color:#fff;border-color:var(--menu);box-shadow:none}
  /* cartões: borda escura, sombra leve, filete azul no topo */
  .caixa{box-shadow:inset 0 5px 0 var(--menu),var(--sombra);padding-top:22px}
  .caixa>h2:first-child{padding-bottom:10px;border-bottom:1px dashed var(--linha)}
  h2{color:var(--navy);font-weight:bold;letter-spacing:.03em}
  h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--menu);font-weight:bold;padding-bottom:6px;border-bottom:1px solid var(--linha);margin:18px 0 8px}
  .aviso{color:var(--cinza)}
  /* botões */
  button{border-width:2px;border-radius:6px;box-shadow:none}
  button:hover{transform:none;box-shadow:none;filter:brightness(.96)}
  button:active{transform:none;box-shadow:none;filter:brightness(.9)}
  button:disabled{box-shadow:none;filter:none}
  button.secundario:hover{background:#EEF2F8;filter:none}
  button.mini{border-radius:6px;box-shadow:none;padding:6px 12px}
  .link:hover{filter:none}
  a.botaoLink{border-width:2px;border-radius:6px;box-shadow:none}
  a.botaoLink.maior{border-radius:6px;box-shadow:none}
  a.botaoLink:hover{transform:none;background:#EEF2F8}
  /* chips e abas */
  .chip,.aba{border:1.5px solid var(--linha);border-radius:4px;color:#41546C;font-weight:normal;background:#fff}
  .chip:hover,.aba:hover{border-color:var(--azul);color:var(--menu);background:#fff}
  .chip[aria-pressed="true"],.chip.ativo,.aba[aria-pressed="true"]{background:var(--menu);border-color:var(--menu);color:#fff}
  /* campos */
  label.rot,.grupoTitulo{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--menu);font-weight:bold}
  input[type=text],input[type=number],input[type=password],input[type=email],input[type=date],input[type=time],select,textarea{border:1.5px solid var(--linha);border-radius:6px}
  input[type=text]:hover,input[type=number]:hover,input[type=password]:hover,input[type=email]:hover,input[type=date]:hover,input[type=time]:hover,select:hover,textarea:hover{border-color:var(--azul)}
  input:focus,select:focus,textarea:focus{border-color:var(--azul)}
  /* etiquetas e números */
  .tag{font-family:var(--mono);font-size:10.5px;border-radius:4px;border-width:1px;padding:2px 7px}
  .badge{font-family:var(--mono)}
  .nota{font-family:var(--mono)}
  .grande{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
  .contagem{font-family:var(--mono)}
  .stepper{border:1.5px solid var(--linha);border-radius:6px}
  .stepper button{filter:none}
  .stepper span{font-family:var(--mono);font-weight:600}
  th{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--menu);font-weight:bold}
  .cfg span:nth-child(even){font-family:var(--mono)}
  /* avisos */
  .convite{border:1px solid var(--linha);border-left:3px solid var(--ambar);border-radius:0 6px 6px 0}
  .erro{background:#FDF1F0;border:1px solid #EFC6C2;border-left:3px solid #B3261E;border-radius:0 8px 8px 0;color:#8F1E18}
  .ok{background:#F1F8F5;border:1px solid #C9E2D8;border-left:3px solid #1B7A57;border-radius:0 8px 8px 0;color:#146144}
  .detalhe{border-width:1.5px;border-color:var(--linha);border-left:3px solid var(--menu);border-radius:0 8px 8px 0}

  .questao,.qEdit,.cartao{border-radius:12px}
  .cabecalho .quem{margin-left:auto;text-align:right}
  @media (max-width:520px){.cabecalho .quem{margin-left:0;text-align:left}}
  label.arquivo{border-width:2px;border-radius:6px;box-shadow:none}
  .tabelaBox{border-width:1.5px;border-radius:8px}
  .sugIA{font-family:var(--mono);border-radius:4px}
  .miniaturas figcaption{font-family:var(--mono)}

  .abas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .aba{border:1.5px solid var(--linha);border-radius:4px;padding:8px 14px;font-size:13px;color:#41546C;background:#fff;box-shadow:none;font-weight:normal}
  .aba[aria-pressed="true"]{background:var(--menu);border-color:var(--menu);color:#fff}
  /* ===== Chat com IA ===== */
  .aba.abaChat{border:2px solid var(--menu);color:var(--menu);font-weight:bold;background:#EEF2F8}
  .aba.abaChat[aria-pressed="true"]{background:var(--menu);color:#fff}
  .chatCab{display:flex;gap:14px;align-items:center;margin-bottom:10px}
  .chatCab .robo{font-size:38px;line-height:1;background:var(--bloco);border:2px solid var(--menu);border-radius:14px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;flex:none}
  .chatCab h2{margin:0 0 2px;border:0!important;padding:0!important}
  .chatMsgs{display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:52vh;overflow-y:auto;padding:12px;background:#fbfcfe;border:1.5px solid var(--linha);border-radius:10px;margin:10px 0}
  .msg{max-width:86%;padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.5;word-wrap:break-word}
  .msg.eu{align-self:flex-end;background:var(--menu);color:#fff;border-bottom-right-radius:4px}
  .msg.ia{align-self:flex-start;background:#fff;border:1.5px solid var(--linha);border-bottom-left-radius:4px;color:var(--navy)}
  .msg.ia b{color:var(--menu)}
  .msg.pensando{color:var(--cinza);font-style:italic}
  .chatEntrada{display:flex;gap:8px;align-items:flex-end}
  .chatEntrada textarea{min-height:48px;max-height:160px;flex:1}
  .chatRodape{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:8px;font-size:12.5px;color:var(--cinza)}
  .chatRodape .usoIA{font-family:var(--mono,Consolas,monospace);font-size:11.5px}

  /* bolinha "?" pequena, como expoente; ao clicar abre uma caixinha flutuante (fecha clicando fora) */
  details.ajuda{display:inline-block;position:relative;vertical-align:super;margin:0 0 0 2px;line-height:1}
  details.ajuda[open]{display:inline-block;margin:0 0 0 2px}
  details.ajuda>summary{width:14px;height:14px;font-size:9.5px;line-height:14px;font-weight:bold;box-shadow:none;border:0}
  details.ajuda>div{position:absolute;z-index:60;top:19px;left:-10px;width:300px;max-width:78vw;margin:0;background:#fff;color:var(--navy);
    border:1px solid var(--linha,#d9dee8);border-left:4px solid var(--menu);border-radius:8px;box-shadow:0 8px 24px rgba(14,42,92,.18);
    padding:10px 12px;font-size:13px;line-height:1.5;font-weight:normal;text-transform:none;letter-spacing:0;text-align:left;white-space:normal}
</style>
</head>
<body>
<div class="wrap">

  <div class="cabecalho">
    <div class="topoFlex">
      <div>
        <h1>Prova por IA</h1>
        <p>Veja a correção da sua prova questão por questão: o que acertou, o que faltou e como melhorar.</p>
      </div>
      <div class="quem" id="quem"></div>
    </div>
    <div class="barraVisao">
      <div class="visao oculto" id="visao" role="group" aria-label="Escolher visão">
        <button type="button" data-visao="prof" aria-pressed="true">Professor</button>
        <button type="button" data-visao="aluno" aria-pressed="false">Aluno</button>
      </div>
      <a class="btMsg oculto" id="btMensagens" href="aulas.html?msgs=1">✉️ Mensagens</a>
    </div>
  </div>

  <div id="erroGeral" class="erro oculto" role="alert"></div>

<script>
/* Mesmo servidor do Aula por IA. */
var BACKEND_AULAS = 'https://script.google.com/macros/s/AKfycbyK-YXssnq1iBhqVAPMl4BlccH7eI1-0U9EqqOKV7vgK0qJSe9rgo51XZKxK45V2gOj/exec';

var token = '';
// Ao sair da conta (ou quando o login acaba porque o navegador do computador foi fechado),
// este aparelho para de receber os avisos dessa conta.
function desligarAvisosAoSair(tk){
  try{
    var f = localStorage.getItem('avisos_token');
    localStorage.removeItem('avisos_token'); localStorage.removeItem('avisos_em');
    if(f && tk) fetch('https://script.google.com/macros/s/AKfycbyK-YXssnq1iBhqVAPMl4BlccH7eI1-0U9EqqOKV7vgK0qJSe9rgo51XZKxK45V2gOj/exec', {method: 'POST', keepalive: true,
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({acao: 'removerAvisos', dados: {token: tk, fcm: f}})}).catch(function(){});
    if(navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(function(r){ return r && r.pushManager.getSubscription(); })
      .then(function(sub){ if(sub) sub.unsubscribe(); }).catch(function(){});
  }catch(e){}
}
// Login sem "manter conectado" (computador da faculdade): o login acaba quando o Chrome/Edge é fechado.
// Cada aba aberta dá sinal de vida a cada 30 s; se ficou mais de 3 min sem nenhuma aba aberta
// (navegador fechado, mesmo que ele restaure as abas depois), pede para entrar de novo.
function tokenSalvo(){
  try{
    var t = localStorage.getItem('ip_token'); if(t) return t;
    t = sessionStorage.getItem('ip_token') || '';
    var vivo = Number(localStorage.getItem('ip_vivo') || 0);
    if(t && vivo && Date.now() - vivo > 3 * 60000){ desligarAvisosAoSair(t); sessionStorage.removeItem('ip_token'); return ''; }
    if(t) localStorage.setItem('ip_vivo', String(Date.now()));
    return t;
  }catch(e){ return ''; }
}
setInterval(function(){ try{ if(sessionStorage.getItem('ip_token')) localStorage.setItem('ip_vivo', String(Date.now())); }catch(e){} }, 30000);
token = tokenSalvo();
var sessao = null, resumo = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nota10(n){ return n === null || n === undefined || n === '' ? '—' : Number(n).toFixed(1).replace('.', ','); }
function num(n){ return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }
function classe10(n){ return n < 4.5 ? '0' : n < 7 ? '1' : '2'; }
function dataHora(ms){ var d = new Date(ms); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function hora(ms){ return new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function mmss(ms){ var s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + 'h ' : '') + (m < 10 && h ? '0' : '') + m + 'min ' + (x < 10 ? '0' : '') + x + 's'; }

function api(acao, dados, tentativa){
  tentativa = tentativa || 0;
  dados = dados || {}; dados.token = token;
  return fetch(BACKEND_AULAS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({acao:acao, dados:dados})})
  .then(function(r){ if(!r.ok) throw new Error('O servidor respondeu ' + r.status + '.'); return r.json(); })
  .then(function(j){
    if(!j.ok){
      if(j.erro === 'SESSAO'){ mostrarLogin(); throw new Error('Sua sessão expirou. Entre de novo.'); }
      // servidor ocupado (muita gente enviando junto): espera um tempo sorteado e tenta de novo
      if(j.erro === 'OCUPADO' && tentativa < 3) return new Promise(function(res){ setTimeout(res, 1500 + Math.random() * 2500 * (tentativa + 1)); }).then(function(){ return api(acao, dados, tentativa + 1); });
      if(j.erro === 'OCUPADO') throw new Error('Muita gente enviando ao mesmo tempo. Tente de novo em alguns segundos.');
      throw new Error(j.erro || 'Não deu para concluir.');
    }
    return j.resultado;
  })
  .catch(function(e){ if(e instanceof TypeError){ var x = new Error('Sem conexão com o servidor. Verifique sua internet e tente de novo.'); x.rede = true; throw x; } throw e; });
}

function erroGeral(msg){ var e = $('erroGeral'); e.textContent = msg || ''; e.classList.toggle('oculto', !msg); if(msg) e.scrollIntoView({block:'nearest'}); }
// Sem login: vai direto para a tela de entrar (com trava de 15 s contra idas e voltas).
function mostrarLogin(){
  var agora = Date.now(), ult = 0;
  try{ ult = Number(sessionStorage.getItem('ip_redir') || 0); }catch(e){}
  if(agora - ult > 15000){
    try{ sessionStorage.setItem('ip_redir', String(agora)); }catch(e){}
    location.replace('index.html?voltar=provas'); return;
  }
  $('tCarregando').classList.add('oculto'); $('tLogin').classList.remove('oculto'); $('tAluno').classList.add('oculto'); $('tProf').classList.add('oculto'); }

// contagens regressivas: data-fim (ms do servidor) e data-desvio (servidor - cliente)
setInterval(function(){
  document.querySelectorAll('[data-fim]').forEach(function(el){
    var resta = Number(el.dataset.fim) - (Date.now() + Number(el.dataset.desvio || 0));
    el.textContent = resta > 0 ? mmss(resta) : 'encerrado';
  });
}, 1000);

/* ---------------- início ---------------- */
function iniciar(){
  if(!token){ mostrarLogin(); return; }
  api('sessao').then(function(r){
    $('tCarregando').classList.add('oculto');

    sessao = r;
    $('quem').innerHTML = '<b>' + esc(r.nome) + '</b>' + (r.email ? '<span style="display:block">' + esc(r.email) + (r.professor ? ' · professor' : ' · conta de aluno') + '</span>' : '') +
      '<a href="aulas.html">Aula por IA</a> · <a href="index.html">Avaliador</a> · <a href="index.html?conta=1">minha conta</a> · <a href="#" id="linkSair">trocar de conta / sair</a>';
    $('linkSair').addEventListener('click', function(e){ e.preventDefault(); desligarAvisosAoSair(token); try{ localStorage.removeItem('ip_token'); sessionStorage.removeItem('ip_token'); }catch(x){} location.href = 'index.html'; });
    $('btMensagens').classList.remove('oculto');
    if(r.professor){ $('visao').classList.remove('oculto'); trocarVisao('prof'); }
    else trocarVisao('aluno');
  }).catch(function(e){ $('tCarregando').classList.add('oculto'); erroGeral(e.message); });
}
function lerPref(){ try{ return localStorage.getItem('provas_visao'); }catch(e){ return null; } }
function trocarVisao(v){
  document.querySelectorAll('[data-visao]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.visao === v)); });
  $('tAluno').classList.toggle('oculto', v !== 'aluno');

  abrirProf();
}
document.querySelectorAll('[data-visao]').forEach(function(b){ b.addEventListener('click', function(){ trocarVisao(b.dataset.visao); }); });
document.querySelectorAll('[data-pa]').forEach(function(b){ b.addEventListener('click', function(){
  document.querySelectorAll('[data-pa]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
  $('paProvas').classList.toggle('oculto', b.dataset.pa !== 'provas');
  $('paChat').classList.toggle('oculto', b.dataset.pa !== 'chat');
  if(b.dataset.pa === 'chat') abrirChat($('paChat'));
}); });

/* ---------------- fotos: câmera, galeria, compressão e realce ---------------- */
// Reduz cada foto para no máximo 1800 px e JPEG: sobe rápido e continua legível.
// Com "realçar", trata a imagem como um escâner faria, no próprio aparelho (sem IA).
function prepararArquivo(f, realcar){
  if(f.type === 'application/pdf'){
    if(f.size > 12 * 1024 * 1024) return Promise.reject(new Error('PDF grande demais (máximo 12 MB).'));
    return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res({mime:'application/pdf', dados:String(r.result).split(',')[1], nome:f.name, arquivo:f}); }; r.onerror = rej; r.readAsDataURL(f); });
  }
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function(){
      var max = 1800, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if(realcar){ try{ realcarEscrita(c); }catch(e){ /* se falhar, segue com a foto original */ } }
      var d = c.toDataURL('image/jpeg', realcar ? 0.85 : 0.82);
      res({mime:'image/jpeg', dados:d.split(',')[1], previa:d, nome:f.name, arquivo:f});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('Não deu para abrir "' + f.name + '". Envie uma foto em JPG ou PNG.')); };
    img.src = url;
  });
}

/* Modo documento, em três passos:
   1. estima o fundo do papel (versão bem desfocada da foto) e divide a foto por ele:
      some a sombra e a luz desigual, e o papel fica branco por igual;
   2. estica os tons (níveis automáticos) para a tinta ficar escura;
   3. curva que escurece os tons médios, para traço fraco de lápis ou caneta clara. */
function realcarEscrita(c){
  var w = c.width, h = c.height, ctx = c.getContext('2d');
  var dados = ctx.getImageData(0, 0, w, h), px = dados.data, n = w * h;

  // fundo: reduz muito e amplia de volta (desfoque grande e rápido)
  var pw = Math.max(8, Math.round(w / 24)), ph = Math.max(8, Math.round(h / 24));
  var peq = document.createElement('canvas'); peq.width = pw; peq.height = ph;
  var pctx = peq.getContext('2d'); pctx.imageSmoothingEnabled = true; pctx.imageSmoothingQuality = 'high';
  pctx.drawImage(c, 0, 0, pw, ph);
  // o desfoque também pega a tinta; um "máximo" local puxa o fundo para o tom do papel
  var pd = pctx.getImageData(0, 0, pw, ph), pp = pd.data, cinzaP = new Float32Array(pw * ph), maxP = new Float32Array(pw * ph);
  for(var i = 0; i < pw * ph; i++) cinzaP[i] = 0.299 * pp[i * 4] + 0.587 * pp[i * 4 + 1] + 0.114 * pp[i * 4 + 2];
  for(var y = 0; y < ph; y++) for(var x = 0; x < pw; x++){
    var m = 0;
    for(var dy = -1; dy <= 1; dy++) for(var dx = -1; dx <= 1; dx++){
      var yy = Math.min(ph - 1, Math.max(0, y + dy)), xx = Math.min(pw - 1, Math.max(0, x + dx));
      if(cinzaP[yy * pw + xx] > m) m = cinzaP[yy * pw + xx];
    }
    maxP[y * pw + x] = m;
  }
  for(i = 0; i < pw * ph; i++){ pp[i * 4] = pp[i * 4 + 1] = pp[i * 4 + 2] = maxP[i]; pp[i * 4 + 3] = 255; }
  pctx.putImageData(pd, 0, 0);
  var fundoC = document.createElement('canvas'); fundoC.width = w; fundoC.height = h;
  var fctx = fundoC.getContext('2d'); fctx.imageSmoothingEnabled = true; fctx.imageSmoothingQuality = 'high';
  fctx.drawImage(peq, 0, 0, w, h);
  var fundo = fctx.getImageData(0, 0, w, h).data;

  // passo 1: cinza normalizado pelo fundo
  var v = new Uint8ClampedArray(n), hist = new Uint32Array(256);
  for(i = 0; i < n; i++){
    var g = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
    var b = Math.max(40, fundo[i * 4]);
    var t = Math.min(255, g / b * 255);
    v[i] = t; hist[v[i]]++;
  }
  // passo 2: níveis automáticos (0,5% mais escuro vira preto; o papel vira branco)
  function percentil(p){ var alvo = n * p, s = 0; for(var k = 0; k < 256; k++){ s += hist[k]; if(s >= alvo) return k; } return 255; }
  var baixo = percentil(0.005), alto = Math.max(baixo + 30, Math.min(250, percentil(0.6)));
  // passo 3: curva gama que escurece os tons médios (traço fraco)
  var tabela = new Uint8ClampedArray(256), gama = 1.8;
  for(var k = 0; k < 256; k++){
    var z = (k - baixo) / (alto - baixo); z = Math.max(0, Math.min(1, z));
    tabela[k] = Math.round(255 * Math.pow(z, gama));
  }
  for(i = 0; i < n; i++){ var o = tabela[v[i]]; px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = o; px[i * 4 + 3] = 255; }
  ctx.putImageData(dados, 0, 0);
}

// Seletor de páginas reaproveitado pelo aluno e pelo professor.
function seletorFotos(el, aceitaPdf, aoMudar){
  var paginas = [], realcar = true;
  function desenhar(){
    el.innerHTML = '<div class="botoes" style="margin-top:0">' +
      '<label class="arquivo"><input type="file" accept="image/*" capture="environment" data-cam>Tirar foto</label>' +
      '<label class="arquivo"><input type="file" accept="image/*' + (aceitaPdf ? ',application/pdf' : '') + '" multiple data-gal>Escolher ' + (aceitaPdf ? 'arquivos' : 'da galeria') + '</label></div>' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" data-realce' + (realcar ? ' checked' : '') + ' style="width:20px;height:20px"> Realçar a escrita (tira sombra e escurece letra fraca)</label>' +
      '<div class="miniaturas">' + paginas.map(function(p, i){
        return '<figure>' + (p.previa ? '<img src="' + p.previa + '" alt="Página ' + (i + 1) + '">' : '<div class="pdf">PDF</div>') +
          '<button type="button" class="secundario tirar" data-tirar="' + i + '" aria-label="Tirar página ' + (i + 1) + '">×</button><figcaption>pág. ' + (i + 1) + '</figcaption></figure>';
      }).join('') + '</div>' + (paginas.length ? '<p class="aviso" style="margin-top:8px">Toque numa página para ver em tamanho grande e conferir se dá para ler.</p>' : '<p class="aviso" style="margin-top:8px">Fotografe só as folhas de resposta, cada página inteira, de cima, com boa luz e sem sombra. Escreva o número da questão antes de cada resposta (1, 2a, 2b…). As páginas vão na ordem em que você adicionar.</p>') +
      '<div data-msg></div>';
    el.querySelectorAll('input[type=file]').forEach(function(inp){ inp.addEventListener('change', function(){ adicionar(Array.prototype.slice.call(inp.files)); }); });
    el.querySelector('[data-realce]').addEventListener('change', function(){ realcar = this.checked; reprocessar(); });
    el.querySelectorAll('[data-tirar]').forEach(function(b){ b.addEventListener('click', function(){ paginas.splice(Number(b.dataset.tirar), 1); desenhar(); aoMudar(paginas); }); });
    el.querySelectorAll('.miniaturas img').forEach(function(img){ img.addEventListener('click', function(){ ampliar(img.src); }); });
  }
  function processar(arqs){ return Promise.all(arqs.map(function(f){ return prepararArquivo(f, realcar); })); }
  function adicionar(arqs){
    var msg = el.querySelector('[data-msg]'); msg.innerHTML = '<p class="carregando">Preparando as fotos…</p>';
    processar(arqs).then(function(ps){
      paginas = paginas.concat(ps).slice(0, 15); desenhar(); aoMudar(paginas);
    }).catch(function(e){ desenhar(); el.querySelector('[data-msg]').innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });
  }
  // ligar ou desligar o realce refaz as páginas a partir das fotos originais
  function reprocessar(){
    if(!paginas.length) return;
    var msg = el.querySelector('[data-msg]'); msg.innerHTML = '<p class="carregando">Refazendo as fotos…</p>';
    processar(paginas.map(function(p){ return p.arquivo; })).then(function(ps){ paginas = ps; desenhar(); aoMudar(paginas); })
      .catch(function(e){ el.querySelector('[data-msg]').innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });
  }
  desenhar();
  return { paginas: function(){ return paginas; }, limpar: function(){ paginas = []; desenhar(); aoMudar(paginas); } };
}

function ampliar(src){
  var z = document.createElement('div'); z.className = 'zoom'; z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', 'Foto ampliada');
  z.innerHTML = '<img src="' + src + '" alt="Página da prova">';
  function fechar(){ document.removeEventListener('keydown', tecla); z.remove(); }
  function tecla(e){ if(e.key === 'Escape') fechar(); }
  z.addEventListener('click', fechar); document.addEventListener('keydown', tecla);
  document.body.appendChild(z);
}

/* ---------------- QR code (datashow) ---------------- */
function baseSite(){ return location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, ''); }
function mostrarQR(url, titulo, instrucao){
  var ov = document.createElement('div');
  ov.className = 'qrTela'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'QR code');
  ov.innerHTML = '<div class="qrCaixa"><h2>' + esc(titulo) + '</h2><div class="qrDesenho"></div><p class="qrUrl">' + esc(url) + '</p><p class="qrInstr">' + esc(instrucao) + '</p>' +
    '<div class="botoes" style="justify-content:center"><button type="button" class="secundario">Fechar (Esc)</button></div></div>';
  document.body.appendChild(ov);
  var lado = Math.floor(Math.max(220, Math.min(window.innerHeight * 0.58, window.innerWidth * 0.8, 620)));
  var alvo = ov.querySelector('.qrDesenho');
  if(window.QRCode) new QRCode(alvo, {text: url, width: lado, height: lado, correctLevel: QRCode.CorrectLevel.M});
  else alvo.textContent = 'Não deu para gerar o QR code agora. Use o endereço abaixo.';
  function fechar(){ document.removeEventListener('keydown', tecla); try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} ov.remove(); }
  function tecla(e){ if(e.key === 'Escape') fechar(); }
  document.addEventListener('keydown', tecla);
  ov.querySelector('button').addEventListener('click', fechar);
  try{ if(ov.requestFullscreen) ov.requestFullscreen().catch(function(){}); }catch(e){}
}

/* =====================================================================
   ALUNO
   ===================================================================== */
var provasAluno = [], envioAberto = {};

function abrirAluno(){
  $('listaProvasAluno').innerHTML = '<div class="caixa"><p class="carregando">Carregando suas provas…</p></div>';
  api('minhasProvas').then(function(lista){ provasAluno = lista; desenharProvasAluno(); })
    .catch(function(e){ $('listaProvasAluno').innerHTML = '<div class="caixa"><p class="erro">' + esc(e.message) + '</p></div>'; });
}

function situacaoProva(it){
  var p = it.prova, agora = it.agora;
  if(agora < p.inicio) return 'antes';
  if(agora <= p.fimEnvio) return 'aberta';
  return 'fechada';
}

function desenharProvasAluno(){
  var el = $('listaProvasAluno');
  if(!provasAluno.length){ el.innerHTML = '<div class="caixa"><h2>Minhas provas</h2><p>Nenhuma prova agendada nas suas matérias. As provas aparecem aqui quando o professor publicar.</p></div>'; return; }
  el.innerHTML = provasAluno.map(function(it, i){
    var p = it.prova, e = it.entrega, sit = situacaoProva(it), desvio = it.agora - Date.now();
    var h = '<div class="caixa" id="prova' + i + '"><div class="linha" style="border:0;padding:0 0 8px"><div><h3 style="margin:0">' + esc(p.titulo) + ' · ' + esc(it.disciplina) + '</h3>' +
      '<span class="aviso">Prof. ' + esc(it.professor) + ' · ' + dataHora(p.inicio) + '</span></div>' +
      (e ? tagAluno(e) : sit === 'antes' ? '<span class="tag t-cinza">agendada</span>' : '<span class="tag t-cinza">aguardando o professor</span>') + '</div>';
    // as fotos são enviadas só pelo professor: o aluno acompanha a correção
    if(e) h += correcaoAluno(it, i);
    else if(sit === 'antes') h += '<p>Prova em <b>' + dataHora(p.inicio) + '</b>. Faça a prova em papel e entregue ao professor: ele envia as fotos e a correção aparece aqui.</p>';
    else h += '<p class="aviso">Entregue a prova em papel ao professor. Ele envia as fotos e a correção aparece aqui; você também recebe um aviso.</p>';
    return h + '</div>';
  }).join('');
  el.querySelectorAll('[data-envio]').forEach(function(box){
    var i = Number(box.dataset.envio), bt = box.querySelector('[data-enviar]');
    var sel = seletorFotos(box.querySelector('[data-seletor]'), false, function(pg){ bt.disabled = !pg.length; });
    bt.addEventListener('click', function(){ enviarAluno(i, sel, box); });
  });
  el.querySelectorAll('[data-reenviar]').forEach(function(b){ b.addEventListener('click', function(){ envioAberto[Number(b.dataset.reenviar)] = true; desenharProvasAluno(); }); });
  el.querySelectorAll('[data-vistaenv]').forEach(function(b){ b.addEventListener('click', function(){
    var i = Number(b.dataset.vistaenv), it = provasAluno[i], box = b.closest('details'), itens = {};
    box.querySelectorAll('[data-vista]').forEach(function(t){ if(t.value.trim()) itens[t.dataset.vista] = t.value.trim(); });
    b.disabled = true;

// Etiqueta da tela do aluno: nada sobre as fotos, só "em correção" ou a nota
function tagAluno(e){
  if(!e || e.recebida || e.status !== 'corrigida') return '<span class="tag t-warn">em correção</span>';
  return e.confirmada ? '<span class="tag t-ok">nota definitiva</span>' : '<span class="tag t-warn">nota provisória</span>';
}
// Para o professor: o que o aluno já recebeu desta prova (nada, nota provisória ou nota definitiva)
// Etiqueta da prova liberada: quantas notas provisórias e definitivas os alunos já veem
function tagLiberadas(p){
  var def = p.confirmadas || 0, prov = Math.max(0, (p.corrigidas || 0) - def), quando = ' title="correção liberada para a turma em ' + esc(p.resultadosEm) + '"';
  if(!def && !prov) return '<span class="tag t-ok"' + quando + '>correção liberada (nenhuma pronta ainda)</span>';
  if(!prov) return '<span class="tag t-ok"' + quando + '>✅ liberadas: ' + def + ' definitiva(s)</span>';
  if(!def) return '<span class="tag t-warn"' + quando + '>📝 liberadas: ' + prov + ' provisória(s)</span>';
  return '<span class="tag t-warn"' + quando + '>liberadas: 📝 ' + prov + ' provisória(s) · ✅ ' + def + ' definitiva(s)</span>';
}
// Se o aluno abriu a correção: quantas vezes, tempo total e quando (só o professor vê)
function tempoTxt(seg){ seg = Math.round(seg || 0); return seg < 60 ? seg + ' s' : seg < 3600 ? Math.round(seg / 60) + ' min' : Math.floor(seg / 3600) + ' h ' + Math.round(seg % 3600 / 60) + ' min'; }
function textoVisto(e){
  if(!e || e.status !== 'corrigida') return '<span class="aviso">—</span>';
  var v = e.visto || {};
  if(!v.vezes) return '<span class="aviso">não abriu ainda</span>';
  return '<span title="1ª vez: ' + esc(v.primeiro) + ' · última: ' + esc(v.ultimo) + '">👁 ' + v.vezes + '× · ' + tempoTxt(v.seg) + '<br><span class="aviso">último ' + esc(String(v.ultimo).slice(0, 16)) + '</span></span>';
}
// Resumo acima da tabela: quantos alunos já abriram a correção liberada
function resumoVistos(r){
  if(!r.prova.resultadosLiberados) return '';
  var com = r.alunos.filter(function(a){ return a.entrega && a.entrega.status === 'corrigida'; });
  if(!com.length) return '';
  var viram = com.filter(function(a){ return a.entrega.visto && a.entrega.visto.vezes; });
  var falta = com.filter(function(a){ return !(a.entrega.visto && a.entrega.visto.vezes); }).map(function(a){ return a.nome; });
  return '<p style="margin:8px 0;font-size:14px">👁 <b>' + viram.length + ' de ' + com.length + '</b> alunos já abriram a correção' +
    (falta.length ? ' <span class="aviso">· ainda não abriram: ' + falta.map(esc).join(', ') + '</span>' : ' <span style="color:#1a7a3c">· todos viram</span>') + '</p>';
}
function tagEnvio(e, liberada){
  if(!e || e.status !== 'corrigida') return '<span class="tag t-cinza">nada enviado</span>';
  if(!liberada) return e.confirmada ? '<span class="tag t-cinza" title="O aluno vê quando você liberar a correção para a turma">definitiva salva, não enviada</span>' : '<span class="tag t-cinza">nada enviado</span>';
  return e.confirmada ? '<span class="tag t-ok"' + (e.confirmadaEm ? ' title="em ' + esc(e.confirmadaEm) + '"' : '') + '>✅ definitiva enviada</span>' : '<span class="tag t-warn">📝 provisória enviada</span>';
}
function tagEntrega(e, sit){
  if(e && e.status === 'recebida') return '<span class="tag t-ok">fotos enviadas</span>';
  if(!e) return sit === 'fechada' ? '<span class="tag t-err">não enviada</span>' : sit === 'aberta' ? '<span class="tag t-warn">aguardando envio</span>' : '<span class="tag t-cinza">agendada</span>';
  if(e.status === 'pendente' || e.status === 'corrigindo') return '<span class="tag t-warn">na fila de correção</span>';
  if(e.status === 'erro') return '<span class="tag t-err">correção com problema</span>';
  if(e.status === 'ilegivel') return '<span class="tag t-err">fotos ilegíveis</span>';
  return e.confirmada ? '<span class="tag t-ok">nota definitiva</span>' : '<span class="tag t-warn">nota provisória</span>';
}

function correcaoAluno(it, i){

  if(e.status === 'ilegivel') return '<div class="erro">A IA não conseguiu ler as fotos: ' + esc(e.geral.comentario) + '<br>O professor foi avisado e vai enviar fotos novas.</div>';
  var total = e.questoes.reduce(function(t, q){ return t + q.max; }, 0), obt = e.questoes.reduce(function(t, q){ return t + (q.pontos || 0); }, 0);
  var h = '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px"><span class="grande">' + nota10(e.notaFinal) + '</span><span class="aviso">de 10 · ' + num(obt) + ' de ' + num(total) + ' pontos · ' +

    (e.confirmada ? '' : '<div class="convite" style="margin:0 0 10px">⏳ <b>Esta nota é provisória:</b> o professor ainda vai revisar a correção. Se algo foi lido ou corrigido errado, peça <b>vista de prova</b> no fim desta página.</div>');
  if(e.geral.professor) h += '<div class="detalhe"><b>Comentário do professor:</b> ' + esc(e.geral.professor) + '</div>';
  h += '<div class="detalhe"><p class="fb" style="margin-top:0"><b>Visão geral:</b> ' + esc(e.geral.comentario) + '</p>' +
    (e.geral.fortes ? '<p class="fb"><b>Pontos fortes:</b> ' + esc(e.geral.fortes) + '</p>' : '') +
    (e.geral.estudar ? '<p class="fb"><b>O que estudar:</b> ' + esc(e.geral.estudar) + '</p>' : '') + '</div>';
  h += '<h4>Questão por questão</h4>' + e.questoes.map(function(q){
    return '<div class="questao"><div class="cab"><span>Questão ' + esc(q.rotulo || q.ordem) + (q.assunto ? ' · <span style="font-weight:normal">' + esc(q.assunto) + '</span>' : '') + '</span><span class="nota n' + classe10(q.max ? (q.pontos || 0) / q.max * 10 : 0) + '">' + num(q.pontos || 0) + ' / ' + num(q.max) + '</span></div>' +
      (q.acertos ? '<p class="fb"><b>O que você acertou:</b> ' + esc(q.acertos) + '</p>' : '') +
      (q.faltou ? '<p class="fb"><b>O que faltou:</b> ' + esc(q.faltou) + '</p>' : '') +
      (q.melhorar ? '<p class="fb"><b>Como melhorar:</b> ' + esc(q.melhorar) + '</p>' : '') +
      (q.professor ? '<p class="fb"><b>Professor:</b> ' + esc(q.professor) + '</p>' : '') +
      '<details style="margin-top:6px"><summary class="link" style="font-size:13px">O que a IA leu da sua resposta</summary><p style="white-space:pre-line;font-size:14px;margin-top:6px">' + (esc(q.transcricao) || '<i>nada: em branco ou não encontrada</i>') + '</p></details>' +
      (q.vista ? '<div class="vistaBox"><b>Sua vista:</b> ' + esc(q.vista.texto) + '<br>' + (q.vista.resposta ? '<b>Resposta do professor:</b> ' + esc(q.vista.resposta) : '<span class="aviso">aguardando o professor</span>') + '</div>' : '') + '</div>';
  }).join('');
  if(e.revisaoPedida) h += '<div class="ok">Outro ponto enviado ao professor: "' + esc(e.revisaoPedida) + '".</div>';
  // vista de prova: UMA vez por prova, enquanto a nota é provisória

      abertas.map(function(q){
        return '<label class="rot" style="margin-top:8px">Questão ' + esc(q.rotulo || q.ordem) + '</label><textarea data-vista="' + esc(q.id) + '" style="min-height:50px" placeholder="ex.: Na 2ª linha eu escrevi 72 °C (não 12 °C), por isso a conclusão é pasteurização rápida."></textarea>';

      '<div class="botoes"><button type="button" class="mini" data-vistaenv="' + i + '">Enviar vista</button></div><div id="msgRev' + i + '"></div></details>';

    }); });

// prova sem etapa (ou de etapa removida) conta na primeira
// itens do tipo prova da composição; prova antiga sem item vai para o primeiro item de prova da etapa
// a prova final não pertence a nenhuma etapa: entra na média final = (semestre + final) ÷ 2
var OPCAO_FINAL = {etapa: {id: '', nome: 'Prova final'}, item: {id: 'PF', tipo: 'prova', nome: 'Prova final', valor: 10}, final: true};
function itensDeProva(etapas){
  var l = [];
  etapas.forEach(function(e){ (e.itens || []).forEach(function(it){ if(it.tipo === 'prova') l.push({etapa: e, item: it}); }); });
  l.push(OPCAO_FINAL);
  return l;
}
function itemDaProva(etapas, p){
  if(p && p.item === 'PF') return OPCAO_FINAL;
  var l = itensDeProva(etapas).filter(function(x){ return !x.final; });
  return l.filter(function(x){ return x.item.id === p.item; })[0] || l.filter(function(x){ return x.etapa.id === p.etapa; })[0] || l[0] || null;
}
function rotuloItem(etapas, p){
  var x = itemDaProva(etapas, p);
  return x ? (x.final ? 'Prova final (média final = (semestre + final) ÷ 2)' : x.etapa.nome + ' · ' + x.item.nome + ' (vale ' + nota10(x.item.valor) + ')') : 'sem item de prova na composição';
}

    (p && p.entregas ? '<div class="erro"><b>⚠ Atenção:</b> esta prova já tem ' + p.entregas + ' entrega(s). Qualquer alteração nas questões, no gabarito ou nos pontos pode mudar as notas dos alunos. Se mudar, use "Corrigir todas de novo" nas entregas e confira as notas antes de liberar.</div>' : '') + '</div>';

  function usarGerada(g, m, como){

  }

    bgc.disabled = true;
    api('provaGerada', {codigo: $('pGerSel').value}).then(function(g){ bgc.disabled = false; bgc.dataset.conf = ''; bgc.textContent = 'Carregar'; usarGerada(g, $('msgExtrair'), ''); })

      return codigoNoTexto(r.texto).then(function(c2){ return tentarGerada(c2, 'pelo código escrito no arquivo'); }).then(function(ok){
        return ok ? {pronto: true} : api('extrairQuestoes', {fotos: r.partes});
      });
    }).then(function(res){
      if(res && res.pronto) return;
      if(res && res.codigo) return tentarGerada(res.codigo, 'pelo código impresso na folha').then(function(ok){ if(!ok) preencher(res.questoes || []); });

      if(!qs.length){ m.innerHTML = '<div class="erro">Não encontrei questões no arquivo.</div>'; return; }
      lerQs();
      var vazias = qsEdit.every(function(q){ return !q.enunciado; });
      var novas = qs.map(function(q){ return {rotulo:q.rotulo, assunto:q.assunto, enunciado:q.enunciado, pontos:q.pontos || '', gabarito:q.gabarito || '', instrucoes:q.instrucoes || '', sugestoes:q.sugestoes || []}; });
      qsEdit = vazias ? novas : qsEdit.concat(novas);
      desenharQs();
      var nSug = novas.reduce(function(t, q){ return t + q.sugestoes.length; }, 0);
      m.innerHTML = '<div class="ok">' + qs.length + ' questão(ões) preenchida(s). O que estava no arquivo foi transcrito.</div>' +
        (nSug ? '<div class="erro"><b>' + nSug + ' campo(s) foram sugeridos pela IA</b> porque não estavam no arquivo (valor, gabarito ou critérios). Eles estão marcados em vermelho: revise cada um antes da prova.</div>' : '');
    }
  });

    lerQs();
    var bt = this, dt = $('pData').value, hr = $('pHora').value;

    if(!dt || !hr){ $('pErro').textContent = 'Informe a data e a hora da prova.'; $('pErro').classList.remove('oculto'); return; }
    bt.disabled = true;
    api('salvarProva', {prova: {id: p ? p.id : '', disciplinaId: discSel, titulo: $('pTit').value, inicio: new Date(dt + 'T' + hr).getTime(),

      criterios: Array.prototype.filter.call(el.querySelectorAll('[data-pcrit]'), function(c){ return c.checked; }).map(function(c){ return c.dataset.pcrit; }),
      salvarPadrao: $('pPadrao').checked, gerada: geradaAtual,
      aulas: Array.prototype.filter.call(el.querySelectorAll('[data-paula]'), function(c){ return c.checked; }).map(function(c){ return c.dataset.paula; }),
      publicada: $('pPub').checked, questoes: qsEdit.map(function(q){ q.pontos = String(q.pontos).replace(',', '.'); return q; })}})
      .then(listarProvas).catch(function(e){ bt.disabled = false; $('pErro').textContent = e.message; $('pErro').classList.remove('oculto'); });
  });
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

  }).join('');
  var total = qsEdit.reduce(function(t, q){ return t + (Number(String(q.pontos).replace(',', '.')) || 0); }, 0);
  $('pTotal').textContent = '· total ' + num(total) + ' pontos (a nota da prova é convertida para 0 a 10)';
  $('qsBox').querySelectorAll('[data-tirafig]').forEach(function(b){ b.addEventListener('click', function(){
    if(b.dataset.conf !== '1'){ b.dataset.conf = '1'; b.textContent = 'Confirmar: remover esta figura'; return; }
    lerQs();
    var x = b.dataset.tirafig.split(':'), q = qsEdit[Number(x[0])];

  $('qsBox').querySelectorAll('[data-subir]').forEach(function(b){ b.addEventListener('click', function(){ lerQs(); var i = Number(b.dataset.subir), t = qsEdit[i]; qsEdit[i] = qsEdit[i - 1]; qsEdit[i - 1] = t; desenharQs(); }); });

  $('qsBox').querySelectorAll('[data-c="pontos"], [data-c="gabarito"], [data-c="instrucoes"]').forEach(function(inp){ inp.addEventListener('input', function(){

  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
// Word: arquivo .doc no formato "página da web com imagens" (MHTML), que o Word abre com as figuras
function baixarWordProva(d, gab){
  var r = folhaProva(d, {gabarito: gab, word: true});
  return Promise.all(r.imgs.map(function(x){ return svgParaPng(x.svg, x.w, x.h); })).then(function(pngs){
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>' + esc(nomeArquivoProva(d, gab)) + '</title>' +
      '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
      '<style>@page Section1{size:21cm 29.7cm;margin:2cm 1.8cm 2cm 1.8cm}div.Section1{page:Section1}' + FOLHA_CSS + '</style></head><body><div class="Section1"><div class="folha">' + r.html + '</div></div></body></html>';
    var b = '----=_ProvaPorIA_' + Date.now();
    var partes = ['MIME-Version: 1.0', 'Content-Type: multipart/related; boundary="' + b + '"; type="text/html"', '', '--' + b,
      'Content-Type: text/html; charset="utf-8"', 'Content-Transfer-Encoding: base64', 'Content-Location: file:///C:/prova.htm', '', linhas76(b64Texto(html))];
    pngs.forEach(function(p, i){ partes.push('--' + b, 'Content-Type: image/png', 'Content-Transfer-Encoding: base64', 'Content-Location: file:///C:/' + r.imgs[i].id + '.png', '', linhas76(p)); });
    partes.push('--' + b + '--', '');
    baixarBlob(new Blob([partes.join('\r\n')], {type: 'application/msword'}), nomeArquivoProva(d, gab) + '.doc');
  });
}

/* ---- Word (.docx): lido aqui no navegador (texto + imagens) para a IA ler ---- */
function carregarJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise(function(ok, falha){
    var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = function(){ ok(window.JSZip); }; s.onerror = function(){ falha(new Error('Não deu para abrir o arquivo do Word agora. Salve como PDF e envie de novo.')); };
    document.head.appendChild(s);
  });
}
function lerDocx(f){
  return carregarJSZip().then(function(JSZip){ return JSZip.loadAsync(f); }).then(function(zip){
    var doc = zip.file('word/document.xml'), rels = zip.file('word/_rels/document.xml.rels');
    if(!doc) throw new Error('"' + f.name + '" não parece um arquivo do Word (.docx).');
    return Promise.all([doc.async('string'), rels ? rels.async('string') : '']).then(function(x){
      var xml = x[0], mapa = {};
      String(x[1]).replace(/<Relationship [^>]*?Id="([^"]+)"[^>]*?Target="([^"]+)"/g, function(m, id, alvo){ mapa[id] = 'word/' + alvo.replace(/^\.?\//, ''); return m; });
      String(x[1]).replace(/<Relationship [^>]*?Target="([^"]+)"[^>]*?Id="([^"]+)"/g, function(m, alvo, id){ if(!mapa[id]) mapa[id] = 'word/' + alvo.replace(/^\.?\//, ''); return m; });
      var figs = [], n = 0;
      var texto = xml.replace(/<a:blip [^>]*?r:embed="([^"]+)"[^>]*\/?>/g, function(m, id){ n++; figs.push(mapa[id]); return '[[FIGURA ' + n + ']]'; })
        .replace(/<\/w:p>/g, '\n').replace(/<w:tab\/>/g, '\t').replace(/<\/w:tc>/g, ' | ').replace(/<[^>]+>/g, '')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&')
        .replace(/\[\[FIGURA (\d+)\]\]/g, '[FIGURA $1]').replace(/\n{3,}/g, '\n\n').trim();
      var imgs = figs.map(function(caminho, i){
        var arq = caminho && zip.file(caminho);
        if(!arq || !/\.(png|jpe?g|gif|bmp)$/i.test(caminho)) return Promise.resolve(null);
        return arq.async('blob').then(function(b){ return prepararArquivo(new File([b], 'figura' + (i + 1) + '.png', {type: /\.jpe?g$/i.test(caminho) ? 'image/jpeg' : 'image/png'}), false); }).catch(function(){ return null; });
      });
      return Promise.all(imgs).then(function(l){
        return {texto: texto, partes: [{mime: 'text/plain', dados: b64Texto('TEXTO DO ARQUIVO "' + f.name + '" (as imagens enviadas são as figuras, na ordem das marcas [FIGURA n]):\n\n' + texto)}]
          .concat(l.filter(Boolean).slice(0, 12).map(function(p){ return {mime: p.mime, dados: p.dados}; }))};
      });
    });
  });
}
// Fotos, PDF e Word viram as partes que vão para a IA
function partesDosArquivos(arqs){
  return Promise.all(arqs.map(function(f){
    if(/\.docx$/i.test(f.name) || f.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return lerDocx(f);
    if(/\.doc$/i.test(f.name)) return Promise.reject(new Error('"' + f.name + '" está no formato antigo do Word (.doc). No Word, salve como .docx ou PDF e envie de novo.'));
    return prepararArquivo(f, false).then(function(p){ return {texto: '', partes: [{mime: p.mime, dados: p.dados}]}; });
  })).then(function(l){ return {texto: l.map(function(x){ return x.texto; }).join('\n'), partes: [].concat.apply([], l.map(function(x){ return x.partes; }))}; });
}

/* ---- prova gerada ↔ questões do cadastro da prova ---- */
function linhasDaGerada(dados){
  var l = [];
  (dados.questoes || []).forEach(function(q, k){
    q.itens.forEach(function(it, j){
      l.push({rotulo: String(k + 1) + (q.itens.length > 1 ? 'abcdefgh'.charAt(j) : ''), assunto: q.titulo, enunciado: it.enunciado, pontos: it.pontos,
        gabarito: it.gabarito, instrucoes: it.criterios, contexto: q.texto, figura: (q.figuras || []).slice(), sugestoes: []});
    });
  });
  return l;
}
function grupoDoRotulo(r, i){ var m = String(r || '').match(/^\s*(\d+)/); return m ? m[1] : '#' + i; }
// questões do cadastro → estrutura da folha (itens com o mesmo número formam uma questão)
function dadosDasLinhas(linhas){
  var qs = [], ult = null;
  linhas.filter(function(q){ return String(q.enunciado || '').trim(); }).forEach(function(q, i){
    var g = grupoDoRotulo(q.rotulo, i);
    if(!ult || ult.g !== g){ ult = {g: g, titulo: q.assunto || '', texto: q.contexto || '', figuras: q.figura || [], itens: []}; qs.push(ult); }
    ult.itens.push({enunciado: q.enunciado, pontos: Number(String(q.pontos).replace(',', '.')) || 0, gabarito: q.gabarito || '', criterios: q.instrucoes || ''});
  });
  return qs;
}

// provas antigas no banco (cada uma é lida pela IA uma vez, ao enviar)
function desenharModelos(sel){
  var box = $('gModelos'); if(!box) return;
  // cada disciplina tem o seu banco: só aparecem as provas antigas enviadas nesta disciplina
  var l = (dadosDisc.modelosProva || []).filter(function(m){ return m.disciplinaId === discSel; }), aberta = !!(box.querySelector('details[open]'));
  var nMarc = l.filter(function(m){ return sel ? sel.indexOf(m.id) !== -1 : m.disciplinaId === discSel; }).length;
  // a lista fica recolhida; clicando, abre para marcar ou tirar
  box.innerHTML = (l.length ? '<details' + (aberta ? ' open' : '') + ' style="margin:2px 0 4px"><summary style="cursor:pointer;font-size:14px">Provas antigas no banco: <b>' + l.length + '</b> · <span id="gModeloConta">' + nMarc + '</span> marcada(s) para esta prova <span class="aviso">(clique para ver e marcar)</span></summary><div style="padding:6px 0 0">' + l.map(function(m){
    var marcado = sel ? sel.indexOf(m.id) !== -1 : m.disciplinaId === discSel;
    return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between">' + marcaCaixa('data-gmodelo', m.id, marcado, esc(m.nome) + ' <span class="aviso">· ' + esc(String(m.criado).slice(0, 10)) + '</span>') +
      '<button type="button" class="secundario mini" data-tiramodelo="' + esc(m.id) + '">Tirar</button></div>';
  }).join('') + '</div></details>' : '<p class="aviso" style="margin:2px 0">Nenhuma prova antiga no banco ainda.</p>') +
    '<label class="arquivo" style="margin-top:6px"><input type="file" accept="image/*,application/pdf,.docx" multiple id="gModeloArq">+ Adicionar prova antiga ao banco (PDF, Word ou fotos)</label><div id="gModeloMsg"></div>';
  box.querySelectorAll('[data-tiramodelo]').forEach(function(b){ b.addEventListener('click', function(){
    if(b.dataset.conf !== '1'){ b.dataset.conf = '1'; b.textContent = 'Confirmar: tirar do banco'; return; }
    b.disabled = true;
    api('removerModeloProva', {id: b.dataset.tiramodelo}).then(function(l){ dadosDisc.modelosProva = l; desenharModelos(marcadosAgora()); }).catch(function(e){ b.disabled = false; erroGeral(e.message); });
  }); });
  box.querySelectorAll('[data-gmodelo]').forEach(function(c){ c.addEventListener('change', function(){ var n = $('gModeloConta'); if(n) n.textContent = (marcadosAgora() || []).length; }); });
  $('gModeloArq').addEventListener('change', function(){
    var arqs = Array.prototype.slice.call(this.files), m = $('gModeloMsg');
    if(!arqs.length) return;
    m.innerHTML = '<p class="carregando">Lendo a prova antiga… (uns 30 segundos; é lida uma vez só)</p>';
    partesDosArquivos(arqs).then(function(r){
      return api('enviarModeloProva', {disciplinaId: discSel, nome: arqs[0].name.replace(/\.[^.]+$/, ''), fotos: r.partes});
    }).then(function(l){ var antes = marcadosAgora(); dadosDisc.modelosProva = l; desenharModelos(antes ? antes.concat([l[l.length - 1].id]) : null); $('gModeloMsg').innerHTML = '<div class="ok">Prova guardada no banco.</div>'; })
      .catch(function(e){ m.innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });
  });
}

// a lista "Provas geradas" lá em cima acompanha as mudanças

function htmlListaGeradas(l){
  if(!l || !l.length) return '';
  return '<details style="margin-top:12px"' + (l.length <= 3 ? ' open' : '') + '><summary style="cursor:pointer;font-weight:bold">Provas geradas pela IA (' + l.length + ')</summary>' +
    l.map(function(g){
      var p = g.provaId && (dadosDisc.provas || []).filter(function(x){ return x.id === g.provaId; })[0];
      return '<div class="linha"><div><b>' + esc(g.titulo) + '</b> <span class="tag t-azul">' + esc(g.codigo) + '</span>' + (p ? ' <span class="tag t-ok">usada em ' + esc(p.titulo) + '</span>' : '') +
        '<div class="aviso">' + esc(g.criado) + ' · ' + g.questoes + ' questão(ões)</div></div>' +
        '<span class="botoes" style="margin:0"><button type="button" class="mini" data-abrirger="' + esc(g.codigo) + '">Abrir</button><button type="button" class="secundario mini" data-excluirger="' + esc(g.codigo) + '">Excluir</button></span></div>';
    }).join('') + '</details>';
}
function ligarListaGeradas(){
  document.querySelectorAll('[data-abrirger]').forEach(function(b){ if(b.dataset.ligado) return; b.dataset.ligado = '1'; b.addEventListener('click', function(){ abrirGerada(b.dataset.abrirger); }); });
  document.querySelectorAll('[data-excluirger]').forEach(function(b){ if(b.dataset.ligado) return; b.dataset.ligado = '1'; b.addEventListener('click', function(){
    if(b.dataset.conf !== '1'){ b.dataset.conf = '1'; b.textContent = 'Confirmar: excluir ' + b.dataset.excluirger; return; }
    b.disabled = true;
    api('excluirProvaGerada', {codigo: b.dataset.excluirger}).then(function(){ if(GER && GER.codigo === b.dataset.excluirger){ GER = null; $('areaProva').innerHTML = ''; } atualizarListaGeradas(); }).catch(function(e){ b.disabled = false; erroGeral(e.message); });
  }); });
}

var provaAtual = null;

  api('provasDisciplina', {disciplinaId: discSel}).then(function(r){

      var t = document.querySelector('[data-taglib="' + p.id + '"]'), c = document.querySelector('[data-contlib="' + p.id + '"]');

        : '<div class="convite">Correção <b>oculta</b> da turma: os alunos veem só “em correção”. Revise o que quiser e, quando terminar, use “Liberar correção para a turma” na lista de provas: aí cada aluno recebe a nota provisória.</div>') +
      '<details class="convite"><summary style="cursor:pointer;font-weight:bold">📝 Ocorrências da prova' + (String(r.prova.ocorrencias || '').trim() ? ' <span class="tag t-azul">anotadas</span>' : '') + ' <span class="aviso" style="font-weight:normal">(problemas e dúvidas durante a aplicação)</span></summary>' +
        '<p class="aviso" style="margin:6px 0">Anote o que deu problema nesta prova, por exemplo: "a unidade da questão 2 estava errada (era g/L)", "a turma toda entendeu o item 3b como …", "as questões 2 e 4 cobravam o mesmo tema". ' +
          '<b>Na correção</b>, a IA usa isto para que um erro da prova <b>não prejudique o aluno</b> (só a favor dele, nunca para tirar pontos). E o <b>gerador de provas</b> evita esses problemas nas próximas.</p>' +

      (r.prova.ocorrPendente ? (function(){
        var n = r.alunos.filter(function(a){ return a.entrega && a.entrega.status === 'corrigida'; }).length;
        return '<div class="erro" id="ocPend"><b>⚠ Ocorrências novas:</b> ' + n + ' prova(s) já foram corrigidas sem considerar as ocorrências anotadas. Para que o erro da prova não prejudique ninguém, corrija de novo. ' +
          '<span class="aviso" style="color:inherit">(Corrigir de novo refaz a correção da IA de todas as entregas: ajustes feitos à mão e notas definitivas destas provas voltam para a correção nova.)</span>' +
          '<div class="botoes" style="margin-top:8px"><button type="button" class="mini" id="ocRecorr">Corrigir de novo com as ocorrências</button><button type="button" class="secundario mini" id="ocDispensa">Não precisa</button></div></div>';
      })() : '') +
      resumoVistos(r) +

      r.alunos.map(function(a, i){
